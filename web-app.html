<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>赛博放生 · 电子河流</title>
<style>
/* ==================== Reset & Base ==================== */
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
html, body { height: 100%; width: 100%; }
body {
  font-family: -apple-system, "PingFang SC", "Hiragino Sans GB", sans-serif;
  color: var(--ink);
  line-height: 1.6;
  -webkit-font-smoothing: antialiased;
  -moz-osx-font-smoothing: grayscale;
  overflow: hidden;
  position: relative;
}
button { font-family: inherit; border: none; background: none; cursor: pointer; color: inherit; }
textarea, input { font-family: inherit; }

/* ==================== Tokens ==================== */
:root {
  --teal: #2c8a7a;
  --teal-deep: #1f3a36;
  --teal-light: #d4e8e2;
  --coral: #ed7d5b;
  --coral-soft: #fce8df;
  --lake: #3e7a96;
  --paper: #faf6ec;
  --paper-warm: #f5ede0;
  --ink: #2a2a2a;
  --ink-soft: #555;
  --ink-mute: #999;
  --line: #e0ddd5;
  --line-soft: #eeebe5;
  --glass-bg: rgba(255, 255, 255, 0.78);
  --glass-bg-strong: rgba(255, 255, 255, 0.88);
  --glass-border: rgba(255, 255, 255, 0.55);
  --shadow-glass: 0 12px 40px rgba(31, 58, 54, 0.18), 0 4px 12px rgba(31, 58, 54, 0.08);
  --shadow-card: 0 2px 8px rgba(31, 58, 54, 0.06);
}

.serif { font-family: "Kaiti SC", "STKaiti", "Songti SC", "STSong", serif; }
.mono { font-family: "SF Mono", "Monaco", "Menlo", "Consolas", monospace; letter-spacing: 0.02em; }

/* ==================== Water Background ==================== */
.water-bg {
  position: fixed;
  inset: 0;
  z-index: 0;
  background:
    radial-gradient(ellipse at 20% 10%, rgba(212, 232, 226, 0.55) 0%, transparent 50%),
    radial-gradient(ellipse at 80% 90%, rgba(62, 122, 150, 0.35) 0%, transparent 55%),
    linear-gradient(160deg, #d4e8e2 0%, #a9d2c5 35%, #6fae9c 70%, #3e7a7e 100%);
  overflow: hidden;
}
.water-bg::before,
.water-bg::after {
  content: '';
  position: absolute;
  inset: -50%;
  background:
    radial-gradient(ellipse 60% 40% at 30% 40%, rgba(255,255,255,0.18), transparent 60%),
    radial-gradient(ellipse 50% 35% at 70% 60%, rgba(255,255,255,0.12), transparent 60%);
  animation: waterShimmer 18s ease-in-out infinite alternate;
  will-change: transform;
  transform: translateZ(0);
}
.water-bg::after {
  animation: waterShimmer2 24s ease-in-out infinite alternate;
  background:
    radial-gradient(ellipse 45% 30% at 60% 30%, rgba(212,232,226,0.22), transparent 60%),
    radial-gradient(ellipse 55% 40% at 25% 70%, rgba(212,232,226,0.18), transparent 60%);
  opacity: 0.7;
}
@keyframes waterShimmer {
  0%   { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(4%, -3%) rotate(2deg); }
}
@keyframes waterShimmer2 {
  0%   { transform: translate(0, 0) rotate(0deg); }
  100% { transform: translate(-3%, 4%) rotate(-2deg); }
}

/* Subtle ripple lines */
.water-ripples {
  position: fixed;
  inset: 0;
  z-index: 1;
  pointer-events: none;
  background-image:
    repeating-linear-gradient(
      90deg,
      transparent 0px,
      transparent 80px,
      rgba(255,255,255,0.04) 80px,
      rgba(255,255,255,0.04) 81px,
      transparent 81px,
      transparent 160px
    ),
    repeating-linear-gradient(
      0deg,
      transparent 0px,
      transparent 120px,
      rgba(255,255,255,0.03) 120px,
      rgba(255,255,255,0.03) 121px,
      transparent 121px,
      transparent 240px
    );
  animation: rippleDrift 30s linear infinite;
  will-change: transform;
  transform: translateZ(0);
}
@keyframes rippleDrift {
  0%   { transform: translate(0, 0); }
  100% { transform: translate(80px, 0); }
}

/* ==================== App Shell ==================== */
.app-shell {
  position: relative;
  z-index: 2;
  width: 100%;
  height: 100vh;
  display: flex;
  flex-direction: column;
}

/* ==================== Top Nav ==================== */
.top-nav {
  flex-shrink: 0;
  height: 64px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 0 28px;
  background: rgba(255, 255, 255, 0.92);
  border-bottom: 1px solid rgba(255, 255, 255, 0.4);
  position: relative;
  z-index: 10;
}
.nav-logo {
  font-family: "Kaiti SC", "STKaiti", "Songti SC", serif;
  font-size: 22px;
  font-weight: 600;
  color: var(--teal-deep);
  letter-spacing: 0.12em;
  display: flex;
  align-items: center;
  gap: 8px;
}
.nav-logo .logo-mark {
  width: 28px; height: 28px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal), var(--teal-deep));
  display: inline-flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(31, 58, 54, 0.25);
}
.nav-toggle {
  display: inline-flex;
  align-items: center;
  gap: 4px;
  background: rgba(255, 255, 255, 0.6);
  border: 1px solid rgba(255, 255, 255, 0.6);
  border-radius: 99px;
  padding: 4px;
  box-shadow: var(--shadow-card);
}
.nav-toggle .nav-pill {
  padding: 7px 22px;
  font-size: 13px;
  color: var(--ink-soft);
  border-radius: 99px;
  letter-spacing: 0.08em;
  transition: all 0.25s ease;
  font-weight: 500;
}
.nav-toggle .nav-pill.active {
  background: linear-gradient(135deg, var(--teal), var(--teal-deep));
  color: #fff;
  box-shadow: 0 2px 8px rgba(31, 58, 54, 0.25);
}
.nav-right {
  display: flex;
  align-items: center;
  gap: 12px;
}
.nav-avatar {
  width: 34px; height: 34px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal-light), var(--teal));
  color: var(--teal-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 13px;
  font-weight: 600;
  box-shadow: 0 2px 6px rgba(31, 58, 54, 0.18);
}
.nav-login-tag {
  font-size: 10px;
  color: var(--teal);
  background: rgba(212, 232, 226, 0.7);
  padding: 4px 10px;
  border-radius: 99px;
  letter-spacing: 0.08em;
  border: 1px solid rgba(44, 138, 122, 0.2);
}

/* ==================== View Container ==================== */
.view-container {
  flex: 1;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
.view {
  position: absolute;
  inset: 0;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.4s ease;
  display: flex;
}
.view.active {
  opacity: 1;
  pointer-events: auto;
}

/* ==================== Release View ==================== */
.release-view {
  display: flex;
  width: 100%;
  height: 100%;
}

/* Water canvas (left, 60%) */
.water-canvas {
  flex: 0 0 60%;
  position: relative;
  overflow: hidden;
  min-height: 0;
}
.water-canvas {
  position: relative;
}

.globe-canvas {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  display: none;
  touch-action: none;
  cursor: grab;
  z-index: 5;
}

.globe-canvas:active { cursor: grabbing; }

/* 风格切换按钮（仅 3D 模式） */
.style-toggle {
  display: none;
  position: absolute;
  top: 10px;
  right: 10px;
  z-index: 8;
  padding: 6px 14px;
  font-size: 12px;
  border-radius: 16px;
  border: 1px solid rgba(169, 210, 197, 0.4);
  background: rgba(10, 40, 48, 0.55);
  color: rgba(223, 243, 236, 0.9);
  backdrop-filter: blur(6px);
  cursor: pointer;
  letter-spacing: 1px;
}

.style-toggle:active { transform: scale(0.95); }

/* 3D 初始化成功后显示切换按钮（两种模式下都要能切） */
.water-canvas.has-3d .style-toggle { display: block; }

.water-canvas.mode-3d .globe-canvas { display: block; }
.water-canvas.mode-3d .world-map { visibility: hidden; }

/* 3D 模式深海背景，衬托发光地球 */
.water-canvas.mode-3d {
  background:
    radial-gradient(130% 100% at 50% 26%, rgba(23, 74, 82, 0.55) 0%, rgba(8, 34, 46, 0.85) 46%, rgba(4, 16, 28, 0.96) 100%);
}

.water-canvas.mode-3d .river-stat {
  background: rgba(6, 22, 30, 0.45);
  backdrop-filter: blur(6px);
  border-radius: 12px;
}

.water-canvas.mode-3d .river-stat .stat-line { color: rgba(223, 243, 236, 0.9); }
.water-canvas.mode-3d .river-stat .muted { color: rgba(223, 243, 236, 0.55); }

/* 3D 模式下热门水域改为玻璃胶囊，不抢地球的戏；沉到底部统计栏上方 */
.water-canvas.mode-3d .hot-bubbles {
  top: auto;
  bottom: 48px;
  left: 10px;
  right: 10px;
  gap: 5px;
}

.water-canvas.mode-3d .hot-bubble {
  background: rgba(10, 40, 48, 0.55);
  border: 1px solid rgba(169, 210, 197, 0.35);
  color: rgba(223, 243, 236, 0.85);
  backdrop-filter: blur(6px);
  font-size: 10px;
}

.water-canvas.mode-3d .hot-bubble.active {
  background: rgba(237, 125, 91, 0.85);
  border-color: rgba(255, 200, 170, 0.8);
  color: #fff;
}

.water-canvas.mode-3d .map-hint {
  color: rgba(223, 243, 236, 0.75);
  background: rgba(10, 40, 48, 0.35);
  backdrop-filter: blur(4px);
}

.world-map {
  position: absolute;
  inset: 0;
  overflow: hidden;
  cursor: grab;
  touch-action: none;
  background: linear-gradient(180deg, rgba(207, 228, 221, 0.4) 0%, rgba(169, 210, 197, 0.5) 60%, rgba(127, 182, 164, 0.6) 100%);
}
.world-map.dragging { cursor: grabbing; }
.map-svg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  user-select: none;
  -webkit-user-select: none;
}

/* Water markers */
.water-marker { cursor: pointer; }
.water-marker circle.dot {
  fill: #3e7a96;
  stroke: #fff;
  stroke-width: 1.5;
  transition: r 0.2s ease;
}
.water-marker.lake circle.dot { fill: #2c8a7a; }
.water-marker.river circle.dot { fill: #2c8a7a; }
.water-marker.trench circle.dot { fill: #ed7d5b; }
.water-marker.selected circle.dot {
  fill: #ed7d5b;
  stroke: #fff;
  stroke-width: 2.5;
  r: 7;
}
.water-marker .pulse {
  fill: none;
  stroke: #ed7d5b;
  stroke-width: 1.2;
  opacity: 0;
}
.water-marker.selected .pulse { animation: mapPulse 1.8s ease-out infinite; }
@keyframes mapPulse {
  0% { r: 7; opacity: 0.7; }
  100% { r: 20; opacity: 0; }
}
.water-label {
  font-size: 9px;
  fill: #1f3a36;
  text-anchor: middle;
  pointer-events: none;
  font-family: "PingFang SC", sans-serif;
  font-weight: 600;
  paint-order: stroke;
  stroke: #faf6ec;
  stroke-width: 2.5;
  stroke-linejoin: round;
}
.water-marker.selected .water-label { fill: #ed7d5b; }

/* Hot bubbles */
.hot-bubbles {
  position: absolute;
  top: 16px; left: 16px; right: 16px;
  display: flex;
  gap: 6px;
  z-index: 5;
  flex-wrap: wrap;
  pointer-events: none;
}
.hot-bubble {
  pointer-events: auto;
  padding: 5px 12px;
  background: rgba(255,255,255,0.92);
  border: 1px solid #ed7d5b;
  border-radius: 99px;
  font-size: 11px;
  color: #ed7d5b;
  white-space: nowrap;
  transition: all 0.2s;
  backdrop-filter: blur(8px);
  -webkit-backdrop-filter: blur(8px);
  display: inline-flex;
  align-items: center;
  gap: 4px;
  box-shadow: 0 2px 8px rgba(237, 125, 91, 0.15);
}
.hot-bubble:hover { transform: translateY(-1px); }
.hot-bubble:active { transform: scale(0.95); }
.hot-bubble.active { background: #ed7d5b; color: #fff; }

/* Map hint */
.map-hint {
  position: absolute;
  bottom: 80px; left: 50%;
  transform: translateX(-50%);
  font-size: 11px;
  color: rgba(31, 58, 54, 0.7);
  letter-spacing: 0.12em;
  pointer-events: none;
  z-index: 2;
  background: rgba(255,255,255,0.85);
  padding: 4px 14px;
  border-radius: 99px;
  transition: opacity 0.4s;
  white-space: nowrap;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.map-hint.hidden { opacity: 0; }

/* Creature layer */
.creature-layer {
  position: absolute;
  bottom: 80px;
  left: 50%;
  transform: translateX(-50%);
  width: 38%;
  max-width: 280px;
  pointer-events: none;
  z-index: 3;
  transition: all 0.9s cubic-bezier(0.5, 0, 0.3, 1);
  filter: drop-shadow(0 8px 16px rgba(31, 58, 54, 0.25));
}
.creature-layer.released {
  bottom: -60%;
  opacity: 0;
  transform: translateX(-50%) scale(0.5);
}
.creature-layer svg {
  width: 100%;
  height: auto;
  animation: float 4s ease-in-out infinite;
}

/* River stat bar */
.river-stat {
  position: absolute;
  bottom: 16px; left: 16px;
  background: rgba(255,255,255,0.85);
  backdrop-filter: blur(10px);
  -webkit-backdrop-filter: blur(10px);
  border-radius: 12px;
  padding: 10px 14px;
  font-size: 12px;
  color: var(--ink-soft);
  display: flex;
  flex-direction: column;
  gap: 4px;
  z-index: 4;
  border: 1px solid rgba(255,255,255,0.5);
  box-shadow: var(--shadow-card);
}
.river-stat .num { color: var(--teal); font-weight: 600; font-family: "SF Mono", "Monaco", monospace; }
.river-stat .stat-line { display: flex; align-items: center; gap: 6px; }
.river-stat .stat-line.muted { color: var(--ink-mute); font-size: 11px; }

/* Control panel (right, 40%) */
.control-panel {
  flex: 0 0 40%;
  padding: 24px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
}
.control-panel::-webkit-scrollbar { width: 4px; }
.control-panel::-webkit-scrollbar-thumb { background: rgba(31, 58, 54, 0.2); border-radius: 2px; }

.glass-panel {
  background: var(--glass-bg);
  backdrop-filter: blur(24px) saturate(160%);
  -webkit-backdrop-filter: blur(24px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: 20px;
  padding: 28px;
  box-shadow: var(--shadow-glass);
  width: 100%;
  max-width: 460px;
  margin: 0 auto;
}

.section-block { margin-bottom: 22px; }
.section-block:last-child { margin-bottom: 0; }
.section-label {
  font-size: 12px;
  color: var(--ink-mute);
  margin-bottom: 10px;
  letter-spacing: 0.1em;
  font-weight: 500;
  display: flex;
  align-items: center;
  gap: 6px;
}
.section-label .label-hint {
  font-size: 11px;
  color: var(--coral);
  font-weight: 400;
}
.section-label .label-num {
  width: 18px; height: 18px;
  border-radius: 50%;
  background: var(--teal-light);
  color: var(--teal-deep);
  display: inline-flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  font-weight: 600;
}

/* Feeling input */
.feeling-row {
  display: flex;
  gap: 10px;
  align-items: flex-end;
  margin-bottom: 8px;
}
.mic-btn {
  width: 52px; height: 52px;
  border-radius: 50%;
  background: rgba(212, 232, 226, 0.7);
  border: 1px solid var(--teal);
  color: var(--teal-deep);
  font-size: 22px;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  transition: all 0.2s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.mic-btn:hover { transform: translateY(-1px); }
.mic-btn:active { transform: scale(0.92); }
.mic-btn.recording {
  background: var(--coral);
  border-color: var(--coral);
  color: #fff;
  animation: micPulse 1.2s ease-in-out infinite;
}
@keyframes micPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(237, 125, 91, 0.4); }
  50% { box-shadow: 0 0 0 10px rgba(237, 125, 91, 0); }
}
.feeling-textarea {
  flex: 1;
  min-height: 52px;
  max-height: 120px;
  padding: 14px 16px;
  border: 1px solid var(--line);
  border-radius: 14px;
  background: rgba(255, 253, 247, 0.85);
  font-size: 14px;
  color: var(--ink);
  line-height: 1.5;
  resize: none;
  outline: none;
  transition: border-color 0.2s, box-shadow 0.2s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.feeling-textarea:focus {
  border-color: var(--teal);
  box-shadow: 0 0 0 3px rgba(44, 138, 122, 0.12);
}
.feeling-textarea::placeholder { color: var(--ink-mute); opacity: 0.75; }
.feeling-hint {
  font-size: 11px;
  color: var(--ink-mute);
  line-height: 1.5;
}
.feeling-hint .dot { color: var(--coral); margin-right: 2px; }

/* Creature chips */
.creature-chips {
  display: flex;
  gap: 10px;
  flex-wrap: wrap;
}
.chip {
  padding: 10px 16px;
  background: rgba(255, 253, 247, 0.7);
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 13px;
  color: var(--ink-soft);
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.chip:hover { transform: translateY(-1px); border-color: var(--coral); }
.chip:active { transform: scale(0.96); }
.chip.coral.active {
  background: var(--coral);
  color: #fff;
  border-color: var(--coral);
  box-shadow: 0 4px 12px rgba(237, 125, 91, 0.35);
}

/* Feedback options */
.feedback-options {
  display: flex;
  gap: 8px;
  flex-wrap: wrap;
}
.fb-opt {
  padding: 8px 14px;
  background: rgba(255, 253, 247, 0.7);
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 12px;
  color: var(--ink-soft);
  transition: all 0.2s;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}
.fb-opt:hover { border-color: var(--teal); }
.fb-opt:active { transform: scale(0.95); }
.fb-opt.active {
  background: var(--ink);
  color: var(--paper);
  border-color: var(--ink);
}
.fb-date {
  width: 100%;
  margin-top: 10px;
  padding: 10px 14px;
  border: 1px solid var(--line);
  border-radius: 10px;
  font-size: 13px;
  color: var(--ink-soft);
  background: rgba(255, 253, 247, 0.85);
  outline: none;
  transition: border-color 0.2s;
}
.fb-date:focus { border-color: var(--teal); }

/* Release button */
.release-btn {
  position: relative;
  overflow: hidden;
  width: 100%;
  margin-top: 6px;
  padding: 16px;
  background: linear-gradient(180deg, var(--coral) 0%, #d96d4d 100%);
  color: #fff;
  border-radius: 99px;
  font-size: 16px;
  font-weight: 600;
  letter-spacing: 0.12em;
  box-shadow: 0 6px 20px rgba(237, 125, 91, 0.4);
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}
.release-btn:hover:not(:disabled) { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(237, 125, 91, 0.5); }
.release-btn:active:not(:disabled) { transform: translateY(0); }
.release-btn:disabled {
  background: #d8d0bf;
  color: #faf6ec;
  box-shadow: none;
  cursor: not-allowed;
}
.release-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,0.3), transparent);
  animation: shine 3.5s infinite;
}
@keyframes shine {
  0% { left: -100%; }
  60%, 100% { left: 100%; }
}

/* ==================== Archive View ==================== */
.archive-view {
  width: 100%;
  height: 100%;
  padding: 24px;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
  display: flex;
  flex-direction: column;
  align-items: center;
}
.archive-view::-webkit-scrollbar { width: 6px; }
.archive-view::-webkit-scrollbar-thumb { background: rgba(31, 58, 54, 0.2); border-radius: 3px; }

.archive-panel {
  background: var(--glass-bg-strong);
  backdrop-filter: blur(28px) saturate(160%);
  -webkit-backdrop-filter: blur(28px) saturate(160%);
  border: 1px solid var(--glass-border);
  border-radius: 24px;
  padding: 32px;
  box-shadow: var(--shadow-glass);
  width: 100%;
  max-width: 1100px;
  display: flex;
  flex-direction: column;
  max-height: calc(100vh - 112px);
}

.user-bar {
  flex-shrink: 0;
  display: flex;
  align-items: center;
  gap: 16px;
  padding-bottom: 20px;
  border-bottom: 1px solid var(--line-soft);
}
.user-avatar {
  width: 48px; height: 48px;
  border-radius: 50%;
  background: linear-gradient(135deg, var(--teal-light), var(--teal));
  color: var(--teal-deep);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 18px;
  font-weight: 600;
  flex-shrink: 0;
  box-shadow: 0 2px 8px rgba(31, 58, 54, 0.15);
}
.user-info { flex: 1; min-width: 0; }
.user-name { font-size: 16px; font-weight: 600; color: var(--ink); }
.user-id { font-size: 11px; color: var(--ink-mute); font-family: "SF Mono", "Monaco", monospace; letter-spacing: 0.04em; margin-top: 2px; }
.login-tag {
  font-size: 10px;
  color: var(--teal);
  background: var(--teal-light);
  padding: 4px 10px;
  border-radius: 99px;
  letter-spacing: 0.08em;
  flex-shrink: 0;
}

.stats-row {
  flex-shrink: 0;
  display: flex;
  padding: 22px 0;
  border-bottom: 1px solid var(--line-soft);
  gap: 16px;
}
.stat-item {
  flex: 1;
  text-align: center;
  padding: 8px 12px;
  background: rgba(255, 253, 247, 0.5);
  border-radius: 12px;
  transition: transform 0.2s;
}
.stat-item:hover { transform: translateY(-2px); }
.stat-num {
  font-family: "Kaiti SC", "STKaiti", "Songti SC", serif;
  font-size: 32px;
  line-height: 1;
  font-weight: 400;
}
.stat-num.teal { color: var(--teal); }
.stat-num.coral { color: var(--coral); }
.stat-label {
  font-size: 11px;
  color: var(--ink-mute);
  margin-top: 6px;
  letter-spacing: 0.06em;
}

.record-list {
  flex: 1;
  overflow-y: auto;
  padding: 20px 4px 8px;
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 14px;
  -webkit-overflow-scrolling: touch;
  align-content: start;
  align-items: start;
}
.record-list::-webkit-scrollbar { width: 4px; }
.record-list::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

.empty-state {
  grid-column: 1 / -1;
  text-align: center;
  padding: 80px 20px;
  color: var(--ink-mute);
  font-size: 14px;
  line-height: 2;
}

.record-card {
  background: rgba(255, 253, 247, 0.95);
  border: 1px solid var(--line-soft);
  border-radius: 14px;
  padding: 16px;
  transition: box-shadow 0.2s, border-color 0.2s;
}
.record-card:hover { box-shadow: var(--shadow-card); border-color: var(--line); }
.record-card.has-reply { cursor: pointer; }
.record-card.has-reply:hover { border-color: var(--teal); }

.record-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 8px;
}
.record-id {
  font-size: 11px;
  color: var(--ink-mute);
  letter-spacing: 0.02em;
  font-family: "SF Mono", "Monaco", monospace;
}
.record-status {
  font-size: 10px;
  padding: 3px 10px;
  border-radius: 99px;
  letter-spacing: 0.04em;
  white-space: nowrap;
  font-weight: 500;
}
.record-status.replied { background: var(--teal-light); color: var(--teal-deep); }
.record-status.pending { background: var(--coral-soft); color: var(--coral); }

.record-meta {
  font-size: 12px;
  color: var(--ink-soft);
  margin-bottom: 6px;
}
.record-feeling {
  font-size: 12px;
  color: var(--ink);
  font-style: italic;
  line-height: 1.5;
  overflow: hidden;
  text-overflow: ellipsis;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
}

.reply-block {
  max-height: 600px;
  overflow: hidden;
  opacity: 1;
  margin-top: 12px;
  transition: max-height 0.35s ease, opacity 0.3s ease, margin-top 0.3s ease;
}
.reply-block.collapsed {
  max-height: 0;
  opacity: 0;
  margin-top: 0;
}
.reply-inner {
  padding: 12px;
  background: var(--paper-warm);
  border-radius: 10px;
  border-left: 3px solid var(--teal);
}
.reply-label {
  font-size: 10px;
  color: var(--teal);
  letter-spacing: 0.1em;
  margin-bottom: 8px;
  font-weight: 500;
}
/* ===== 漂流瓶拆封 ===== */
.bottle-block {
  margin: 10px 0 4px;
  padding: 22px 12px;
  text-align: center;
  background: linear-gradient(180deg, rgba(207,228,221,.5), rgba(169,210,197,.35));
  border: 1px dashed var(--teal, #4a9c86);
  border-radius: 14px;
}

.bottle-visual {
  font-size: 44px;
  animation: bottleBob 2.6s ease-in-out infinite;
}

@keyframes bottleBob {
  0%, 100% { transform: translateY(0) rotate(-4deg); }
  50% { transform: translateY(-8px) rotate(4deg); }
}

.bottle-text {
  margin: 8px 0 12px;
  font-size: 13px;
  color: var(--ink, #2f4f48);
}

.bottle-open-btn {
  padding: 8px 18px;
  font-size: 13px;
  border-radius: 18px;
  border: 1px solid var(--coral, #ed7d5b);
  background: transparent;
  color: var(--coral, #ed7d5b);
  cursor: pointer;
  transition: all .25s;
}

.bottle-open-btn:hover { background: var(--coral, #ed7d5b); color: #fff; }

.tts-btn {
  margin-left: 8px;
  padding: 2px 10px;
  font-size: 11px;
  border-radius: 12px;
  border: 1px solid var(--teal, #4a9c86);
  background: transparent;
  color: var(--teal, #4a9c86);
  cursor: pointer;
  vertical-align: middle;
}

.reply-image {  width: 100%;
  aspect-ratio: 4 / 3;
  max-height: 180px;
  object-fit: cover;
  border-radius: 8px;
  margin-bottom: 8px;
  display: block;
  cursor: zoom-in;
  background: rgba(0,0,0,0.05);
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}
.reply-image-fallback {
  width: 100%;
  height: 120px;
  border-radius: 8px;
  margin-bottom: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  background-position: center;
  background-size: cover;
  background-repeat: no-repeat;
}
@keyframes previewFadeIn {
  from { opacity: 0; transform: scale(0.98); }
  to { opacity: 1; transform: scale(1); }
}
.preview-image-full {
  animation: previewFadeIn 0.25s ease;
}
.reply-text {
  font-size: 12px;
  color: var(--ink);
  line-height: 1.6;
}

.countdown-block {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--coral-soft);
  border-radius: 8px;
  font-size: 11px;
  color: var(--coral);
  display: flex;
  align-items: center;
  gap: 6px;
}
.countdown-time {
  font-family: "SF Mono", "Monaco", monospace;
  font-weight: 600;
  font-variant-numeric: tabular-nums;
}

/* ==================== Receipt Modal ==================== */
.receipt-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31, 58, 54, 0.55);
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 100;
  padding: 24px;
}
.receipt-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.receipt-card {
  width: 100%;
  max-width: 420px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--paper);
  border-radius: 20px;
  padding: 28px 24px 20px;
  transform: translateY(40px) scale(0.96);
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
  box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  position: relative;
}
.receipt-overlay.show .receipt-card { transform: translateY(0) scale(1); }
.receipt-card::-webkit-scrollbar { width: 4px; }
.receipt-card::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

/* Perforated edges */
.receipt-card::before, .receipt-card::after {
  content: '';
  position: absolute;
  left: 0; right: 0;
  height: 8px;
  background-image: radial-gradient(circle, var(--paper) 4px, transparent 4px);
  background-size: 14px 8px;
  background-repeat: repeat-x;
  z-index: 1;
}
.receipt-card::before { top: -4px; }
.receipt-card::after { bottom: -4px; transform: rotate(180deg); }

.receipt-header {
  text-align: center;
  padding-bottom: 16px;
  border-bottom: 1px dashed var(--line);
  margin-bottom: 16px;
}
.receipt-stamp {
  display: inline-block;
  font-family: "Kaiti SC", "STKaiti", serif;
  font-size: 24px;
  color: var(--coral);
  letter-spacing: 0.4em;
  padding: 6px 16px 6px 20px;
  border: 2px solid var(--coral);
  border-radius: 4px;
  transform: rotate(-3deg);
  margin-bottom: 10px;
}
.receipt-subtitle {
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.16em;
}

.receipt-rows { margin-bottom: 4px; }
.receipt-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  padding: 8px 0;
}
.receipt-row .row-key { color: var(--ink-mute); }
.receipt-row .row-val { color: var(--ink); }
.receipt-row .row-val.mono { font-family: "SF Mono", "Monaco", monospace; font-size: 12px; }
.receipt-row .row-val.serif { font-family: "Kaiti SC", "STKaiti", serif; font-size: 14px; }

.receipt-feeling {
  margin: 14px 0;
  padding: 12px 14px;
  background: var(--paper-warm);
  border-radius: 8px;
  border-left: 3px solid var(--coral);
}
.receipt-sign {
  margin: 14px 0;
  padding: 14px;
  background: var(--teal-light);
  border-radius: 8px;
  text-align: center;
}
.receipt-feedback {
  margin: 14px 0 0;
  padding: 12px 14px;
  background: var(--teal-light);
  border-radius: 8px;
}
.block-label {
  font-size: 10px;
  letter-spacing: 0.14em;
  margin-bottom: 6px;
}
.receipt-feeling .block-label { color: var(--coral); }
.receipt-sign .block-label { color: var(--teal-deep); }
.receipt-feedback .block-label { color: var(--teal-deep); }
.block-text {
  font-size: 13px;
  color: var(--ink);
  line-height: 1.6;
}
.receipt-feeling .block-text { font-style: italic; }
.receipt-sign .block-text {
  font-family: "Kaiti SC", "STKaiti", serif;
  font-size: 16px;
  line-height: 1.5;
}
.receipt-feedback .block-text strong { color: var(--teal-deep); }
.receipt-feedback .block-text .mute { color: var(--ink-mute); font-size: 12px; }

.receipt-actions {
  display: flex;
  gap: 10px;
  margin-top: 16px;
}
.btn-line {
  flex: 1;
  padding: 12px 0;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 13px;
  color: var(--ink-soft);
  transition: all 0.2s;
}
.btn-line:hover { border-color: var(--teal); color: var(--teal); }
.btn-line:active { transform: scale(0.97); }
.btn-primary {
  flex: 1;
  padding: 12px 0;
  background: var(--teal-deep);
  color: var(--paper);
  border-radius: 99px;
  font-size: 13px;
  letter-spacing: 0.06em;
  transition: all 0.2s;
}
.btn-primary:hover { background: var(--teal); }
.btn-primary:active { transform: scale(0.97); }

.receipt-footer {
  text-align: center;
  font-size: 10px;
  color: var(--ink-mute);
  margin-top: 14px;
  letter-spacing: 0.02em;
  line-height: 1.6;
}

/* ==================== Destiny Entry (on archive card) ==================== */
.destiny-entry {
  margin-top: 10px;
  padding: 8px 12px;
  background: linear-gradient(135deg, #e8d5f0, #c4a8d8);
  border-radius: 8px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  cursor: pointer;
  transition: transform 0.2s, box-shadow 0.2s;
}
.destiny-entry:hover { transform: translateY(-1px); box-shadow: 0 4px 12px rgba(196, 168, 216, 0.4); }
.destiny-entry:active { transform: scale(0.98); }
.destiny-entry-label {
  font-size: 11px;
  color: var(--ink);
  font-weight: 500;
  letter-spacing: 0.04em;
  display: flex;
  align-items: center;
  gap: 6px;
}
.destiny-entry-arrow {
  font-size: 14px;
  color: var(--ink-soft);
}
.destiny-entry-progress {
  font-size: 10px;
  color: var(--ink-mute);
  background: rgba(255,255,255,0.6);
  padding: 2px 8px;
  border-radius: 99px;
}

/* ==================== Destiny Modal ==================== */
.destiny-overlay {
  position: fixed;
  inset: 0;
  background: rgba(31, 58, 54, 0.75);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 110;
  padding: 20px;
}
.destiny-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.destiny-modal {
  width: 100%;
  max-width: 440px;
  max-height: 90vh;
  overflow-y: auto;
  background: var(--paper);
  border-radius: 20px;
  padding: 24px 20px 18px;
  transform: translateY(40px) scale(0.96);
  transition: transform 0.4s cubic-bezier(0.2, 0.8, 0.3, 1);
  box-shadow: 0 24px 60px rgba(0,0,0,0.3);
  position: relative;
}
.destiny-overlay.show .destiny-modal { transform: translateY(0) scale(1); }
.destiny-modal::-webkit-scrollbar { width: 4px; }
.destiny-modal::-webkit-scrollbar-thumb { background: var(--line); border-radius: 2px; }

/* ===== 命运航线图 ===== */
.destiny-route {
  margin: 0 0 12px;
  padding: 8px;
  background: rgba(255,255,255,0.5);
  border-radius: 12px;
}

.destiny-route svg { width: 100%; display: block; }

.destiny-route-line {
  animation: routeFlow 2.2s linear infinite;
}

@keyframes routeFlow {
  to { stroke-dashoffset: -16; }
}

.destiny-route-hint {
  text-align: center;
  font-size: 11px;
  color: rgba(47,79,72,0.6);
  margin-top: 2px;
}

/* ===== 年度放生报告 ===== */
.annual-report-btn {
  margin-left: auto;
  padding: 4px 10px;
  font-size: 11px;
  border-radius: 12px;
  border: 1px solid var(--coral, #ed7d5b);
  background: transparent;
  color: var(--coral, #ed7d5b);
  cursor: pointer;
}

.annual-overlay {
  position: fixed;
  inset: 0;
  z-index: 300;
  background: rgba(15,35,32,0.72);
  backdrop-filter: blur(6px);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: previewFadeIn .3s ease;
}

.annual-card {
  width: 100%;
  max-width: 340px;
  max-height: 82vh;
  overflow-y: auto;
  background: linear-gradient(180deg, #10282f, #1c4b4a);
  border-radius: 20px;
  padding: 26px 22px;
  text-align: center;
  color: #f0e6d0;
}

.annual-title { font-size: 20px; font-weight: 700; }
.annual-sub { font-size: 10px; letter-spacing: 2px; opacity: .55; margin: 4px 0 18px; }
.annual-line.big { font-size: 52px; font-weight: 800; color: #ffd970; }
.annual-line.big .unit { font-size: 16px; margin-left: 4px; color: #f0e6d0; }
.annual-cap { font-size: 13px; opacity: .85; margin-bottom: 18px; }
.annual-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.annual-cell {
  background: rgba(255,255,255,0.07);
  border-radius: 12px;
  padding: 12px 8px;
  font-size: 11px;
}
.annual-cell .num { font-size: 22px; margin-bottom: 4px; }
.annual-quote {
  margin-top: 16px;
  padding: 12px;
  border-left: 2px solid #ffd970;
  background: rgba(255,217,112,0.08);
  border-radius: 0 10px 10px 0;
  font-size: 12px;
  line-height: 1.7;
  text-align: left;
}
.annual-quote-from { margin-top: 6px; opacity: .55; font-size: 10px; text-align: right; }
.annual-close {
  margin-top: 18px;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 24px;
  background: #ed7d5b;
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}

.destiny-header {
  text-align: center;
  padding-bottom: 14px;
  border-bottom: 1px dashed var(--line);
  margin-bottom: 16px;
}
.destiny-title {
  font-family: "Kaiti SC", "STKaiti", serif;
  font-size: 22px;
  color: var(--teal-deep);
  letter-spacing: 0.2em;
  margin-bottom: 4px;
}
.destiny-subtitle {
  font-size: 10px;
  color: var(--ink-mute);
  letter-spacing: 0.12em;
}
.destiny-record-id {
  font-family: "SF Mono", "Monaco", monospace;
  font-size: 10px;
  color: var(--ink-mute);
  margin-top: 4px;
}

.destiny-segment {
  margin-bottom: 14px;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--line-soft);
  background: #fdfaf2;
  transition: opacity 0.3s;
}
.destiny-segment.locked {
  opacity: 0.85;
}
.destiny-seg-banner {
  height: 70px;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 32px;
  position: relative;
}
.destiny-seg-body {
  padding: 12px 14px 14px;
}
.destiny-seg-title {
  font-size: 13px;
  font-weight: 600;
  color: var(--ink);
  margin-bottom: 6px;
  letter-spacing: 0.04em;
}
.destiny-seg-text {
  font-size: 12px;
  color: var(--ink-soft);
  line-height: 1.7;
}
.destiny-seg-index {
  position: absolute;
  top: 8px;
  left: 12px;
  font-size: 10px;
  color: rgba(255,255,255,0.85);
  font-family: "SF Mono", "Monaco", monospace;
  background: rgba(31,58,54,0.35);
  padding: 2px 8px;
  border-radius: 99px;
}

.destiny-lock-overlay {
  position: absolute;
  inset: 0;
  background: rgba(31, 58, 54, 0.55);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 8px;
  color: #fff;
}
.destiny-lock-icon { font-size: 22px; }
.destiny-lock-hint { font-size: 10px; letter-spacing: 0.1em; opacity: 0.9; }

.destiny-seg-unlock-btn {
  width: 100%;
  margin-top: 10px;
  padding: 8px 0;
  background: var(--teal-deep);
  color: var(--paper);
  border: none;
  border-radius: 8px;
  font-size: 11px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.2s;
}
.destiny-seg-unlock-btn:hover { background: var(--teal); }
.destiny-seg-unlock-btn:active { transform: scale(0.97); }
.destiny-seg-unlock-btn:disabled { opacity: 0.5; cursor: not-allowed; }

.destiny-actions {
  display: flex;
  gap: 10px;
  margin-top: 8px;
  padding-top: 14px;
  border-top: 1px dashed var(--line);
}
.destiny-bundle-btn {
  flex: 1;
  padding: 11px 0;
  background: linear-gradient(135deg, #ed7d5b, #d96d4d);
  color: #fff;
  border: none;
  border-radius: 99px;
  font-size: 12px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.2s;
}
.destiny-bundle-btn:hover { transform: translateY(-1px); box-shadow: 0 6px 16px rgba(237,125,91,0.4); }
.destiny-bundle-btn:active { transform: scale(0.97); }
.destiny-bundle-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.destiny-close-btn {
  flex: 0 0 80px;
  padding: 11px 0;
  background: transparent;
  border: 1px solid var(--line);
  border-radius: 99px;
  font-size: 12px;
  color: var(--ink-soft);
  cursor: pointer;
  transition: all 0.2s;
}
.destiny-close-btn:hover { border-color: var(--teal); color: var(--teal); }

.destiny-loading {
  text-align: center;
  padding: 40px 20px;
  color: var(--ink-mute);
  font-size: 12px;
}
.destiny-loading .spinner {
  display: inline-block;
  width: 24px;
  height: 24px;
  border: 2px solid var(--line);
  border-top-color: var(--teal);
  border-radius: 50%;
  animation: spin 0.8s linear infinite;
  margin-bottom: 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }

.destiny-pay-toast {
  position: fixed;
  bottom: 40px;
  left: 50%;
  transform: translateX(-50%) translateY(20px);
  background: var(--teal-deep);
  color: #fff;
  padding: 10px 20px;
  border-radius: 99px;
  font-size: 12px;
  letter-spacing: 0.04em;
  opacity: 0;
  pointer-events: none;
  transition: all 0.3s;
  z-index: 200;
  box-shadow: 0 8px 24px rgba(31,58,54,0.3);
}
.destiny-pay-toast.show {
  opacity: 1;

/* ==================== Ad Overlay (激励视频模拟) ==================== */
.ad-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0, 0, 0, 0.85);
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.3s ease;
  z-index: 200;
  padding: 20px;
}
.ad-overlay.show {
  opacity: 1;
  pointer-events: auto;
}
.ad-card {
  width: 100%;
  max-width: 360px;
  background: var(--paper);
  border-radius: 16px;
  overflow: hidden;
  box-shadow: 0 24px 60px rgba(0,0,0,0.4);
  transform: scale(0.96);
  transition: transform 0.3s cubic-bezier(0.2, 0.8, 0.3, 1);
}
.ad-overlay.show .ad-card { transform: scale(1); }
.ad-banner {
  background: linear-gradient(135deg, #2c8a7a, #1f3a36);
  color: #fff;
  padding: 10px 16px;
  font-size: 12px;
  letter-spacing: 0.1em;
  font-weight: 500;
}
.ad-body {
  padding: 20px;
}
.ad-content {
  background: linear-gradient(135deg, #d4e8e2, #c7dbe2);
  border-radius: 12px;
  height: 180px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 12px;
  margin-bottom: 14px;
}
.ad-placeholder {
  font-size: 32px;
  color: var(--teal-deep);
  opacity: 0.6;
}
.ad-tag {
  font-size: 11px;
  color: var(--ink-soft);
  letter-spacing: 0.06em;
}
.ad-countdown {
  text-align: center;
  font-size: 13px;
  color: var(--ink-soft);
  margin-bottom: 14px;
}
.ad-countdown span {
  font-family: "SF Mono", "Monaco", monospace;
  font-weight: 600;
  color: var(--coral);
  font-size: 16px;
}
.ad-close-btn {
  width: 100%;
  padding: 12px 0;
  background: var(--teal-deep);
  color: var(--paper);
  border: none;
  border-radius: 99px;
  font-size: 13px;
  letter-spacing: 0.06em;
  cursor: pointer;
  transition: all 0.2s;
}
.ad-close-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
  background: var(--line);
}
.ad-close-btn:not(:disabled):hover { background: var(--teal); }

    if (!USE_API) return localRelease(data);
    try {
      const res = await fetch(`${API_BASE}/release`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(data)
      });
      if (!res.ok) {
        const errText = await res.text().catch(() => '');
        throw new Error(`后端错误 ${res.status}: ${errText.slice(0, 200)}`);
      }
      return await res.json();
    } catch (e) {
      console.error('[apiRelease] 失败:', e);
      alert('后端 API 连接失败，无法放生。请确认：\n1. 已在 server 目录运行 npm start\n2. 访问的是 http://localhost:3001\n3. 不是 file:// 打开的文件\n\n错误：' + e.message);
      throw e;
    }
  }

    if (!USE_API) return { records: loadRecords(), stats: getStats() };
    const res = await fetch(`${API_BASE}/records?openid=${encodeURIComponent(openid)}`);
    if (!res.ok) {
      const errText = await res.text().catch(() => '');
      throw new Error(`后端错误 ${res.status}: ${errText.slice(0, 200)}`);
    }
    return await res.json();
  }

  function formatCountdown(ms) {

    const h = Math.floor(ms / 3600000);
    const m = Math.floor((ms % 3600000) / 60000);

    return `${pad(h,2)}:${pad(m,2)}:${pad(s,2)}`;

  function localGetDestiny(recordId) {
    const destinies = loadDestinies();
    const records = loadRecords();
    const record = records.find(r => r.id === recordId);
    if (!record) return { error: '记录不存在' };

    // 若命运轨迹不存在，则生成（第 0 段默认免费）
    if (!destinies[recordId]) {
      destinies[recordId] = {
        id: `DST-${recordId}`,
        recordId,
        segments: localGenerateDestinySegments(record.creature),
        unlockedIndices: [0],
        createdAt: Date.now()
      };
      saveDestinies(destinies);
    }
    const d = destinies[recordId];
    const unlocked = new Set(d.unlockedIndices);
    const segments = d.segments.map((seg, i) => {
      if (unlocked.has(i)) {
        return { ...seg, index: i, locked: false };
      }
      return { index: i, title: seg.title, emoji: seg.emoji, bg: seg.bg, locked: true, unlockType: i === 0 ? 'free' : 'ad' };
    });
    return {
      id: d.id,
      recordId: d.recordId,
      segments,
      totalSegments: segments.length,
      unlockedCount: segments.filter(s => !s.locked).length,
      allUnlocked: segments.every(s => !s.locked),
      adDurationMs: 15000
    };
  }

  function localUnlockDestiny(recordId, mode, index) {
    const destinies = loadDestinies();
    const d = destinies[recordId];
    if (!d) return { error: '命运轨迹不存在' };
    const total = d.segments.length;
    const current = new Set(d.unlockedIndices);

    if (mode === 'bundle') {
      if (current.size >= total) {
        return { ok: true, alreadyUnlocked: true, unlockedIndices: Array.from(current).sort((a,b)=>a-b) };
      }
      const all = Array.from({ length: total }, (_, i) => i);
      d.unlockedIndices = all;
      saveDestinies(destinies);
      return { ok: true, adId: 'LOCAL-AD-' + Date.now(), unlockedIndices: all, adWatched: true };
    }

    const idx = parseInt(index, 10);
    if (isNaN(idx) || idx < 0 || idx >= total) return { error: '无效索引' };
    if (current.has(idx)) {
      return { ok: true, alreadyUnlocked: true, unlockedIndices: Array.from(current).sort((a,b)=>a-b) };
    }
    current.add(idx);
    d.unlockedIndices = Array.from(current).sort((a,b)=>a-b);
    saveDestinies(destinies);
    return { ok: true, adId: 'LOCAL-AD-' + Date.now(), unlockedIndices: d.unlockedIndices, adWatched: idx !== 0 };
  }

  function localGenerateReply(id) {
    const records = loadRecords();
    const r = records.find(x => x.id === id);
    if (!r) return { ok: false, error: '记录不存在' };
    if (!r.reply) {
      r.reply = generateReply();
      saveRecords(records);
    }
    // 确保命运轨迹存在
    localGetDestiny(id);
    return { ok: true, reply: r.reply, destinyId: `DST-${id}`, aiEnabled: false };
  }

  function checkPendingReplies() {
    if (USE_API) return false; // 后端模式下由服务器定时器处理
    const records = loadRecords();
    let changed = false;
    records.forEach(r => {
      if (!r.reply && Date.now() >= r.replyAt) {
        r.reply = generateReply();
        changed = true;
      }
    });
    if (changed) {
      saveRecords(records);
      if (state.currentPage === 'archive') {
        renderArchive();
      }
    }
    return changed;
  }

  // ==================== Release Page Handlers ====================
  let placeholderIdx = 0;
  let placeholderTimer = null;

  function attachReleaseHandlers() {
    const feelingText = $('feelingText');
    const micBtn = $('micBtn');
    const creatureChips = $('creatureChips');
    const feedbackOptions = $('feedbackOptions');
    const fbDate = $('fbDate');
    const releaseBtn = $('releaseBtn');
    const worldMap = $('worldMap');
    const mapSvg = $('mapSvg');
    const mapHint = $('mapHint');

    // Restore feeling text
    if (feelingText) {
      feelingText.value = state.feeling;
      feelingText.addEventListener('input', () => {
        state.feeling = feelingText.value;
        updateReleaseBtn();
      });
    }

    // Placeholder rotation
    if (placeholderTimer) clearInterval(placeholderTimer);
    placeholderIdx = 0;
    placeholderTimer = setInterval(() => {
      if (feelingText && document.activeElement !== feelingText && !state.isReleased) {
        feelingText.placeholder = PLACEHOLDERS[placeholderIdx];
      }
      placeholderIdx = (placeholderIdx + 1) % PLACEHOLDERS.length;
    }, 3500);

    // Mic button (Web Speech API if available)
    const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isRecording = false;

    if (SpeechRec) {
      recognition = new SpeechRec();
      recognition.lang = 'zh-CN';
      recognition.continuous = false;
      recognition.interimResults = true;
      recognition.onresult = (e) => {
        let transcript = '';
        for (let i = 0; i < e.results.length; i++) {
          transcript += e.results[i][0].transcript;
        }
        if (feelingText) {
          feelingText.value = transcript;
          state.feeling = transcript;
          updateReleaseBtn();
        }
      };
      recognition.onend = () => {
        isRecording = false;
        if (micBtn) {
          micBtn.classList.remove('recording');
          micBtn.textContent = '🎤';
        }
      };
      recognition.onerror = () => {
        isRecording = false;
        if (micBtn) {
          micBtn.classList.remove('recording');
          micBtn.textContent = '🎤';
        }
      };
    }

    if (micBtn) {
      micBtn.addEventListener('click', () => {
        if (state.isReleased) return;
        if (!recognition) {
          if (feelingText) feelingText.focus();
          return;
        }
        if (isRecording) {
          recognition.stop();
          return;
        }
        try {
          recognition.start();
          isRecording = true;
          micBtn.classList.add('recording');
          micBtn.textContent = '●';
        } catch(_) {}
      });
    }

    // Creature chips
    if (creatureChips) {
      creatureChips.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-creature]');
        if (!btn || state.isReleased) return;
        creatureChips.querySelectorAll('.chip').forEach(c => c.classList.remove('active'));
        btn.classList.add('active');
        state.creature = btn.dataset.creature;
        updateCreatureDisplay();
        updateReleaseBtn();
      });
    }

    // World map drag
    function setMapViewBox() {
      if (mapSvg) mapSvg.setAttribute('viewBox', `${mapVb.x} ${mapVb.y} ${MAP_VB.w} ${MAP_VB.h}`);
    }

    function panToWater(waterId) {
      const c = WATER_COORDS[waterId];
      if (!c) return;
      mapVb.x = Math.max(MAP_BOUNDS.minX, Math.min(MAP_BOUNDS.maxX, c.x - MAP_VB.w / 2));
      mapVb.y = Math.max(MAP_BOUNDS.minY, Math.min(MAP_BOUNDS.maxY, c.y - MAP_VB.h / 2));
      setMapViewBox();
    }

    function onDocPointerMove(e) {
      if (!mapDrag.active) return;
      const dx = e.clientX - mapDrag.startX;
      const dy = e.clientY - mapDrag.startY;
      if (Math.abs(dx) > 4 || Math.abs(dy) > 4) mapDrag.moved = true;
      if (!mapSvg) return;
      const rect = mapSvg.getBoundingClientRect();
      const scaleX = MAP_VB.w / rect.width;
      const scaleY = MAP_VB.h / rect.height;
      mapVb.x = Math.max(MAP_BOUNDS.minX, Math.min(MAP_BOUNDS.maxX, mapDrag.vbX - dx * scaleX));
      mapVb.y = Math.max(MAP_BOUNDS.minY, Math.min(MAP_BOUNDS.maxY, mapDrag.vbY - dy * scaleY));
      setMapViewBox();
    }

    function onDocPointerUp() {
      mapDrag.active = false;
      if (worldMap) worldMap.classList.remove('dragging');
      document.removeEventListener('pointermove', onDocPointerMove);
      document.removeEventListener('pointerup', onDocPointerUp);
    }

    if (worldMap) {
      worldMap.addEventListener('pointerdown', (e) => {
        if (state.isReleased) return;
        mapDrag.active = true;
        mapDrag.moved = false;
        mapDrag.startX = e.clientX;
        mapDrag.startY = e.clientY;
        mapDrag.vbX = mapVb.x;
        mapDrag.vbY = mapVb.y;
        worldMap.classList.add('dragging');
        if (mapHint) mapHint.classList.add('hidden');
        document.addEventListener('pointermove', onDocPointerMove);
        document.addEventListener('pointerup', onDocPointerUp);
      });
    }

    // Water marker clicks
    document.querySelectorAll('.water-marker').forEach(marker => {
      marker.addEventListener('click', (e) => {
        e.stopPropagation();
        if (mapDrag.moved || state.isReleased) return;
        selectWater(marker.dataset.water);
      });
    });

    // Hot bubbles
    document.querySelectorAll('.hot-bubble').forEach(bubble => {
      bubble.addEventListener('click', (e) => {
        e.stopPropagation();
        if (state.isReleased) return;
        panToWater(bubble.dataset.water);
        selectWater(bubble.dataset.water);
      });
    });

    // Feedback options
    if (feedbackOptions) {
      feedbackOptions.addEventListener('click', (e) => {
        const btn = e.target.closest('[data-fb]');
        if (!btn || state.isReleased) return;
        feedbackOptions.querySelectorAll('.fb-opt').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        state.feedbackTime = btn.dataset.fb;
        if (state.feedbackTime === 'custom') {
          if (fbDate) {
            fbDate.style.display = 'block';
            fbDate.focus();
          }
        } else {
          if (fbDate) fbDate.style.display = 'none';
          state.feedbackDate = '';
        }
      });
    }

    if (fbDate) {
      fbDate.addEventListener('change', () => {
        state.feedbackDate = fbDate.value;
      });
    }

    // Release button —— 长按蓄力放生（松手触发），快速点击仍可用
    if (releaseBtn) {
      let pressTimer = null;
      const CHARGE_MS = 600;
      const vibrate = (p) => { if (navigator.vibrate) try { navigator.vibrate(p); } catch(_) {} };
      const startCharge = () => {
        if (releaseBtn.disabled || state.isReleased) return;
        releaseBtn.classList.add('charging');
        vibrate(30);
        pressTimer = setTimeout(() => vibrate([40, 60, 40]), CHARGE_MS);
      };
      const endCharge = (fire) => {
        releaseBtn.classList.remove('charging');
        if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
        if (fire) triggerRelease();
      };
      releaseBtn.addEventListener('pointerdown', (e) => {
        if (releaseBtn.disabled) return;
        e.preventDefault();
        startCharge();
        const onUp = (ev) => {
          document.removeEventListener('pointerup', onUp);
          document.removeEventListener('pointercancel', onUp);
          endCharge(true);
        };
        document.addEventListener('pointerup', onUp);
        document.addEventListener('pointercancel', onUp);
      });
      releaseBtn.addEventListener('click', (e) => e.preventDefault()); // 由长按逻辑接管
      releaseBtn.addEventListener('keydown', (e) => {
        if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); triggerRelease(); }
      });
    }

    // ==================== 3D 地球初始化（失败回落 2D） ====================
    initGlobe3D();
  }

  let globeActive = false;

  // NASA 卫星贴图预加载（昼/夜/水/云；任一失败不阻塞，走程序化兜底）
  async function loadEarthTextures() {
    if (typeof THREE === 'undefined') return null;
    const loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');
    const load = (url) => new Promise((res) => {
      loader.load(url, (t) => res(t), undefined, () => res(null));
      setTimeout(() => res(null), 15000); // 超时兜底
    });
    const base = '/vendor/textures/';
    const [day, night, water, clouds] = await Promise.all([
      load(base + 'earth-blue-marble.jpg'),
      load(base + 'earth-night.jpg'),
      load(base + 'earth-water.png'),
      load(base + 'clouds.png')
    ]);
    return day ? { day, night, water, clouds } : null;
  }

  async function initGlobe3D() {
    const canvas = $('globeCanvas');
    const box = $('waterCanvasBox');
    if (!canvas || !box || typeof Globe3D === 'undefined') return;
    try {
      await window.__globeConfigReady;
      if (window.__worldLandReady) await window.__worldLandReady;
    } catch(_) {}
    const textures = await loadEarthTextures();
    const ok = Globe3D.init({
      canvas,
      textures,
      onSelect: (waterId) => {
        if (state.isReleased) return;
        selectWater(waterId);
      },
      disabled: () => state.isReleased
    });
    if (ok) {
      globeActive = true;
      if (state.water) Globe3D.setMarkersState(state.water);
      startWorldPulse();

      // 3D 地球 / 2D 平面地图切换（持久化；默认 3D）
      const curMode = () => localStorage.getItem('globe_mode') === '2d' ? '2d' : '3d';
      const applyGlobeMode = (mode) => {
        const b = $('waterCanvasBox'), btn = $('globeModeBtn'), h = $('mapHint');
        const is3d = mode === '3d';
        if (b) {
          b.classList.toggle('mode-3d', is3d);
          b.classList.add('has-3d');
        }
        if (Globe3D.setPaused) Globe3D.setPaused(!is3d);
        if (btn) btn.textContent = is3d ? '🗺️ 2D' : '🌐 3D';
        if (h) { h.style.visibility = 'visible'; h.textContent = is3d ? '转动地球 · 点选水域' : '拖动地图 · 点选水域'; }
      };
      applyGlobeMode(curMode());

      const modeBtn = $('globeModeBtn');
      if (modeBtn) {
        modeBtn.addEventListener('click', (e) => {
          e.stopPropagation();
          const next = curMode() === '3d' ? '2d' : '3d';
          localStorage.setItem('globe_mode', next);
          applyGlobeMode(next);
          Sfx.ripple();
        });
      }
    }
  }

  // ==================== 世界脉搏：全球共时感 ====================
  let worldPulseSeen = new Set();
  let worldPulseTimer = null;

  async function fetchWorldPulse() {
    try {
      const r = await fetch('/api/world/pulse');
      if (!r.ok) return;
      const data = await r.json();
      const num = $('worldAliveCount');
      if (num) num.textContent = data.total.toLocaleString();
      // 最近放生 → 球面亮起光点（只对未见过的）
      for (const item of (data.recent || [])) {
        const key = item.ts + ':' + item.water + ':' + item.feeling;
        if (worldPulseSeen.has(key)) continue;
        worldPulseSeen.add(key);
        if (Date.now() - item.ts < 5 * 60 * 1000 && globeActive && Globe3D.addSpark) {
          const w = (Globe3D.WATERS_GEO || {})[item.water];
          if (w) Globe3D.addSpark({ lat: w.lat, lng: w.lng });
        }
      }
    } catch (_) { /* 离线静默 */ }
  }

  function startWorldPulse() {
    if (!USE_API || worldPulseTimer) return;
    fetchWorldPulse();
    worldPulseTimer = setInterval(fetchWorldPulse, 30000);
  }

  // ==================== WebAudio 音效（合成，无外部文件） ====================
  const Sfx = (() => {
    let ctx = null;
    function ac() {
      if (!ctx) {
        const AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
      }
      if (ctx.state === 'suspended') ctx.resume();
      return ctx;
    }
    function tone(freq, dur, { type = 'sine', gain = 0.12, slideTo = null, delay = 0 } = {}) {
      const c = ac(); if (!c) return;
      const o = c.createOscillator(), g = c.createGain();
      o.type = type;
      const t0 = c.currentTime + delay;
      o.frequency.setValueAtTime(freq, t0);
      if (slideTo) o.frequency.exponentialRampToValueAtTime(slideTo, t0 + dur);
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      o.connect(g).connect(c.destination);
      o.start(t0); o.stop(t0 + dur + 0.05);
    }
    function noise(dur, { gain = 0.15, lp = 1200, delay = 0 } = {}) {
      const c = ac(); if (!c) return;
      const len = Math.floor(c.sampleRate * dur);
      const buf = c.createBuffer(1, len, c.sampleRate);
      const d = buf.getChannelData(0);
      for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len);
      const src = c.createBufferSource(); src.buffer = buf;
      const f = c.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = lp;
      const g = c.createGain();
      const t0 = c.currentTime + delay;
      g.gain.setValueAtTime(gain, t0);
      g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
      src.connect(f).connect(g).connect(c.destination);
      src.start(t0);
    }
    return {
      dive() { tone(660, 0.5, { type: 'sine', slideTo: 160, gain: 0.1 }); },
      splash() { noise(0.7, { gain: 0.22, lp: 900 }); tone(180, 0.3, { slideTo: 60, gain: 0.08 }); },
      ripple() { tone(520, 1.2, { type: 'sine', gain: 0.05, slideTo: 320 }); },
      stamp() { noise(0.12, { gain: 0.3, lp: 2500 }); tone(140, 0.15, { type: 'square', gain: 0.06 }); }
    };
  })();

  // ==================== Release Trigger ====================
  function triggerRelease() {
    if (!state.feeling.trim() || !state.creature || !state.water || state.isReleased) return;
    state.isReleased = true;
    updateReleaseBtn();

    const creatureLayer = $('creatureLayer');
    const finish = () => showReceipt();
    const box = $('waterCanvasBox');
    const use3D = globeActive && box && box.classList.contains('mode-3d') &&
                  typeof Globe3D !== 'undefined' && Globe3D.playRelease;

    if (use3D) {
      if (creatureLayer) creatureLayer.style.opacity = '0';
      Sfx.dive();
      setTimeout(() => { Sfx.splash(); Sfx.ripple(); }, 1500);
      Globe3D.playRelease({ creature: state.creature, water: state.water }).then(finish);
    } else {
      if (creatureLayer) {
        creatureLayer.style.opacity = '';
        creatureLayer.classList.remove('released');
        void creatureLayer.offsetWidth; // 强制 reflow，重播下沉动画
        creatureLayer.classList.add('released');
      }
      Sfx.splash();
      setTimeout(finish, 800);
    }
  }

  // ==================== 放生瞬间海报（Canvas 绘制，星象风格） ====================
  function drawPoster(r) {
    const W = 750, H = 1200;
    const c = document.createElement('canvas');
    c.width = W; c.height = H;
    const ctx = c.getContext('2d');

    // 星空底
    const grad = ctx.createLinearGradient(0, 0, 0, H);
    grad.addColorStop(0, '#0e2a33');
    grad.addColorStop(0.55, '#1c4b4a');
    grad.addColorStop(1, '#2e6f60');
    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
    for (let i = 0; i < 160; i++) {
      const x = Math.random() * W, y = Math.random() * H * 0.8;
      const s = Math.random() * 1.8 + 0.4;
      ctx.fillStyle = `rgba(255,255,255,${0.25 + Math.random() * 0.6})`;
      ctx.beginPath(); ctx.arc(x, y, s, 0, Math.PI * 2); ctx.fill();
    }

    // 月亮
    ctx.fillStyle = 'rgba(255,246,224,0.95)';
    ctx.beginPath(); ctx.arc(W - 130, 140, 46, 0, Math.PI * 2); ctx.fill();
    ctx.fillStyle = 'rgba(28,75,74,0.55)';
    ctx.beginPath(); ctx.arc(W - 112, 126, 40, 0, Math.PI * 2); ctx.fill();

    // 水面
    ctx.fillStyle = 'rgba(10,30,34,0.65)';
    ctx.fillRect(0, H * 0.78, W, H * 0.22);
    for (let i = 0; i < 26; i++) {
      const y = H * 0.8 + Math.random() * H * 0.18;
      ctx.strokeStyle = `rgba(169,210,197,${0.06 + Math.random() * 0.12})`;
      ctx.lineWidth = 1 + Math.random() * 2;
      const x = Math.random() * W, w = 40 + Math.random() * 140;
      ctx.beginPath(); ctx.moveTo(x, y); ctx.lineTo(x + w, y); ctx.stroke();
    }

    // 生物剪影（emoji 放大 + 光晕）
    const emoji = CREATURES[r.creature].emoji;
    ctx.save();
    ctx.shadowColor = 'rgba(255,179,138,0.9)';
    ctx.shadowBlur = 60;
    ctx.font = '150px serif';
    ctx.textAlign = 'center';
    ctx.fillText(emoji, W / 2, H * 0.46);
    ctx.restore();
    // 涟漪
    for (let i = 1; i <= 3; i++) {
      ctx.strokeStyle = `rgba(223,243,236,${0.5 / i})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.ellipse(W / 2, H * 0.8, 70 * i, 14 * i, 0, 0, Math.PI * 2);
      ctx.stroke();
    }

    // 文案
    ctx.fillStyle = '#f0e6d0';
    ctx.textAlign = 'center';
    ctx.font = '600 44px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillText(`放生于 · ${WATERS[r.water].name}`, W / 2, H * 0.60);
    ctx.font = '26px "PingFang SC", "Microsoft YaHei", sans-serif';
    ctx.fillStyle = 'rgba(240,230,208,0.85)';
    const signLines = wrapText(ctx, r.sign, W - 160);
    signLines.forEach((line, i) => ctx.fillText(line, W / 2, H * 0.66 + i * 40));
    ctx.font = '22px monospace';
    ctx.fillStyle = 'rgba(223,243,236,0.7)';
    ctx.fillText(`护生编号 ${r.id}`, W / 2, H * 0.90);
    ctx.font = '20px "PingFang SC", sans-serif';
    ctx.fillStyle = 'rgba(223,243,236,0.5)';
    ctx.fillText(`${r.timeStr} · 赛博放生`, W / 2, H * 0.94);
    return c;
  }

  function wrapText(ctx, text, maxW) {
    const lines = [];
    let line = '';
    for (const ch of text) {
      if (ctx.measureText(line + ch).width > maxW) { lines.push(line); line = ch; }
      else line += ch;
    }
    if (line) lines.push(line);
    return lines.slice(0, 2);
  }

  function sharePoster() {
    const btn = $('shareBtn');
    if (!state.receipt) return;
    try {
      const c = drawPoster(state.receipt);
      const url = c.toDataURL('image/png');
      const a = document.createElement('a');

  // ==================== Archive Page Handlers ====================
  function attachArchiveHandlers() {
    const list = $('recordList');
    if (!list) return;

    list.querySelectorAll('.record-card.has-reply').forEach(card => {
      card.addEventListener('click', (e) => {
        // 点击命运轨迹入口时不折叠/展开回信
        if (e.target.closest('.destiny-entry')) return;
        const recordId = card.dataset.recordId;
        const replyBlock = card.querySelector('.reply-block');
        if (!replyBlock) return;

        replyBlock.classList.toggle('collapsed');
        if (replyBlock.classList.contains('collapsed')) {
          state.archiveCollapsedIds.add(recordId);
        } else {
          state.archiveCollapsedIds.delete(recordId);
        }
      });
    });

    // 命运轨迹入口
    list.querySelectorAll('.destiny-entry').forEach(entry => {
      entry.addEventListener('click', (e) => {
        e.stopPropagation();
        const recordId = entry.dataset.recordId;
        openDestinyModal(recordId);
      });
    });

    // 年度放生报告
    const annualBtn = $('annualReportBtn');
    if (annualBtn) {
      annualBtn.addEventListener('click', () => showAnnualReport(state.archiveRecords));
    }

    // 回信配图点击放大
    list.querySelectorAll('.reply-image').forEach(img => {
      img.addEventListener('click', (e) => {
        e.stopPropagation();
        previewImage(img.dataset.full || img.src);
      });
    });

    // 漂流瓶拆封
    list.querySelectorAll('[data-bottle-open]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.bottleOpen;
        localStorage.setItem('cyber_bottle_opened_' + id, '1');
        Sfx.ripple();
        if (navigator.vibrate) { try { navigator.vibrate(30); } catch(_) {} }
        renderArchive();
      });
    });

    // AI 回信语音朗读（Web Speech，生物专属音色）
    list.querySelectorAll('[data-tts]').forEach(btn => {
      btn.addEventListener('click', (e) => {
        e.stopPropagation();
        const id = btn.dataset.tts;
        const rec = records.find(x => x.id === id);
        if (!rec || !rec.reply || !window.speechSynthesis) return;
        if (speechSynthesis.speaking) { speechSynthesis.cancel(); return; }
        const u = new SpeechSynthesisUtterance(rec.reply.text);
        u.lang = 'zh-CN';
        // 生物专属音色：锦鲤轻快 / 乌龟低沉 / 云朵轻飘
        if (rec.creature === 'turtle') { u.pitch = 0.6; u.rate = 0.85; }
        else if (rec.creature === 'cloud') { u.pitch = 1.5; u.rate = 0.95; }
        else { u.pitch = 1.15; u.rate = 1.0; }
        speechSynthesis.speak(u);
      });
    });
  }

  // ==================== 年度放生报告 ====================
  function showAnnualReport(records) {
    if (!records || !records.length) return;
    const byCreature = {}, byWater = {};
    let repliedCount = 0, firstReplyText = '';
    for (const r of records) {
      byCreature[r.creature] = (byCreature[r.creature] || 0) + 1;
      byWater[r.water] = (byWater[r.water] || 0) + 1;
      if (r.reply) {
        repliedCount++;
        if (!firstReplyText) firstReplyText = r.reply.text;
      }
    }
    const top = (obj) => Object.entries(obj).sort((a, b) => b[1] - a[1])[0] || ['-', 0];
    const [tc, tcn] = top(byCreature), [tw, twn] = top(byWater);
    const year = new Date().getFullYear();

    const overlay = document.createElement('div');
    overlay.className = 'annual-overlay';
    overlay.innerHTML = `
      <div class="annual-card">
        <div class="annual-title">🌊 ${year} 放生报告</div>
        <div class="annual-sub">CYBER RELEASE ANNUAL REPORT</div>
        <div class="annual-body">
          <div class="annual-line big">${records.length}<span class="unit">次</span></div>
          <div class="annual-cap">这一年，你把 ${records.length} 份情绪送进了水里</div>

            <div class="annual-cell"><div class="num">📍</div><div>最常去 · ${(WATERS[tw] || { name: tw }).name} ×${twn}</div></div>
            <div class="annual-cell"><div class="num">${repliedCount}</div><div>封回信已抵达</div></div>

    document.body.appendChild(overlay);
    Sfx.ripple();

  // ==================== 命运航线图：放生水域 → 离谱结局地点 ====================
  // 常见地名经纬度速查（LLM 生成离谱地点多为真实地标），未命中时用稳定伪随机坐标
  const LANDMARK_GEO = {
    '东京': [35.7, 139.7], '巴黎': [48.9, 2.35], '纽约': [40.7, -74], '伦敦': [51.5, -0.1],

    '南极': [-80, 0], '北极': [85, 0], '珠峰': [27.99, 86.93], '珠穆朗玛': [27.99, 86.93],
    '亚马逊': [-3.5, -62], '威尼斯': [45.4, 12.3], '罗马': [41.9, 12.5], '迪拜': [25.2, 55.3],
    '马尔代夫': [3.2, 73.2], '大堡礁': [-18.3, 147.7], '好望角': [-34.4, 18.5], '圣地亚哥': [-33.4, -70.7],
    '洛杉矶': [34, -118.2], '旧金山': [37.8, -122.4], '西雅图': [47.6, -122.3], '莫斯科': [55.8, 37.6],
    '曼谷': [13.8, 100.5], '新加坡': [1.35, 103.8], '首尔': [37.6, 127], '孟买': [19, 72.9],
    '伊斯坦布尔': [41, 29], '里约': [-22.9, -43.2], '开普敦': [-33.9, 18.4], '内罗毕': [-1.3, 36.8],
    '拉萨': [29.7, 91.1], '成都': [30.6, 104.1], '重庆': [29.6, 106.5], '上海': [31.2, 121.5],
    '北京': [39.9, 116.4], '香港': [22.3, 114.2], '台北': [25, 121.5], '京都': [35, 135.8],
    '复活节岛': [-27.1, -109.4], '格陵兰': [72, -40], '芬迪湾': [45.3, -65], '死海': [31.5, 35.5],
    '贝加尔': [53.5, 108], '尼斯湖': [57.3, -4.4], '西湖': [30.2, 120.1], '湘江': [28, 113]
  };

  function geocodeLocation(name) {
    if (!name) return null;
    for (const [k, v] of Object.entries(LANDMARK_GEO)) {
      if (name.includes(k)) return { lat: v[0], lng: v[1] };
    }
    // 稳定伪随机（同一地点总落同一点）
    let h = 0;
    for (const ch of name) h = (h * 31 + ch.charCodeAt(0)) | 0;
    return { lat: (h % 14000) / 100 - 70, lng: ((h >> 8) % 34000) / 100 - 170 };
  }

  function latLngToSvg(lat, lng, W, H) {
    return { x: ((lng + 180) / 360) * W, y: ((90 - lat) / 180) * H };
  }

  function buildRouteMapHtml(d) {
    const waterGeo = (window.Globe3D && Globe3D.WATERS_GEO && Globe3D.WATERS_GEO[d.water]) || { lat: 0, lng: -160 };
    const dest = geocodeLocation(d.location);
    if (!dest) return '';
    const W = 320, H = 120;
    const a = latLngToSvg(waterGeo.lat, waterGeo.lng, W, H);
    const b = latLngToSvg(dest.lat, dest.lng, W, H);
    // 大弧线（控制点垂直抬升）
    const mx = (a.x + b.x) / 2, my = (a.y + b.y) / 2;
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    const lift = Math.min(46, len * 0.35);
    const cx = mx - dy / (len || 1) * lift, cy = my + dx / (len || 1) * lift;
    // 已解锁比例 → 航线绘制进度
    const progress = d.totalSegments ? d.unlockedCount / d.totalSegments : 1;
    const totalLen = Math.abs(len) * 1.15;
    const drawn = totalLen * progress;
    return `
      <div class="destiny-route">
        <svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <marker id="routeArrow" viewBox="0 0 8 8" refX="4" refY="4" markerWidth="5" markerHeight="5" orient="auto">
              <circle cx="4" cy="4" r="3" fill="#ed7d5b"/>
            </marker>
          </defs>
          <rect width="${W}" height="${H}" rx="10" fill="rgba(169,210,197,0.18)"/>
          <path d="M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}" fill="none" stroke="rgba(74,156,134,0.3)" stroke-width="2" stroke-dasharray="3 4"/>
          <path d="M ${a.x} ${a.y} Q ${cx} ${cy} ${b.x} ${b.y}" fill="none" stroke="#ed7d5b" stroke-width="2.5"
                stroke-linecap="round" marker-end="url(#routeArrow)"
                stroke-dasharray="${drawn} ${totalLen}" class="destiny-route-line"/>
          <circle cx="${a.x}" cy="${a.y}" r="4" fill="#2c8a7a"/>
          <circle cx="${a.x}" cy="${a.y}" r="7" fill="none" stroke="#2c8a7a" stroke-opacity="0.4">
            <animate attributeName="r" values="5;10;5" dur="2.4s" repeatCount="indefinite"/>
          </circle>
          ${progress >= 1 ? `<circle cx="${b.x}" cy="${b.y}" r="6" fill="#ed7d5b" class="destiny-route-burst">
            <animate attributeName="r" values="3;9;3" dur="1.6s" repeatCount="indefinite"/>
          </circle>` : ''}
          <text x="${a.x}" y="${Math.min(H - 4, a.y + 16)}" font-size="8" text-anchor="middle" fill="#2f4f48">${(WATERS[d.water] || {}).name || '放生点'}</text>
          <text x="${Math.max(30, Math.min(W - 30, b.x))}" y="${Math.max(10, b.y - 8)}" font-size="8" text-anchor="middle" fill="#ed7d5b">${(d.location || '').slice(0, 8)}</text>
        </svg>
        <div class="destiny-route-hint">${progress >= 1 ? '航线抵达终点' : '解锁下一段，航线继续延伸'}</div>
      </div>
    `;
  }

      <div class="destiny-header">
        <div class="destiny-title">命运轨迹</div>
        <div class="destiny-subtitle">DESTINY TRAJECTORY</div>
        <div class="destiny-record-id">${d.recordId}</div>
      </div>
      ${buildRouteMapHtml(d)}
      <div>${segmentsHtml}</div>
      <div class="destiny-actions">
        ${bundleBtnHtml}
        <button class="destiny-close-btn" id="destinyCloseBtn">关闭</button>
      </div>
    `;

    // 绑定解锁按钮
    modal.querySelectorAll('.destiny-seg-unlock-btn').forEach(btn => {
      btn.addEventListener('click', async () => {
        const idx = parseInt(btn.dataset.unlockIndex, 10);
        const needsAd = btn.dataset.needsAd === '1';
        btn.disabled = true;
        const originalText = btn.textContent;

        if (needsAd) {
          // 看广告流程
          const adOk = await watchAd(d.adDurationMs || 15000);
          if (!adOk) {
            showPayToast('广告未完成，解锁失败');
            btn.disabled = false;
            btn.textContent = originalText;
            return;
          }
        }

        btn.textContent = '解锁中…';
        try {
          const res = await apiUnlockDestiny(destinyState.recordId, 'single', idx);
          if (res.ok) {
            showPayToast(idx === 0 ? '已解锁（免费）' : '广告观看完成，已解锁');
            destinyState.data = await apiGetDestiny(destinyState.recordId);
            renderDestinyModal();
          } else {
            showPayToast(res.error || '解锁失败');
            btn.disabled = false;
            btn.textContent = originalText;
          }
        } catch (e) {
          showPayToast('解锁失败');
          btn.disabled = false;
          btn.textContent = originalText;
        }
      });
    });

    const bundleBtn = $('destinyBundleBtn');
    if (bundleBtn) {
      bundleBtn.addEventListener('click', async () => {
        bundleBtn.disabled = true;
        const oldText = bundleBtn.textContent;
        // 看广告流程
        const adOk = await watchAd(d.adDurationMs || 15000);
        if (!adOk) {
          showPayToast('广告未完成，解锁失败');
          bundleBtn.disabled = false;
          bundleBtn.textContent = oldText;
          return;
        }
        bundleBtn.textContent = '解锁中…';
        try {
          const res = await apiUnlockDestiny(destinyState.recordId, 'bundle');
          if (res.ok) {
            showPayToast('广告观看完成，全部解锁');
            destinyState.data = await apiGetDestiny(destinyState.recordId);
            renderDestinyModal();
          } else {
            showPayToast(res.error || '解锁失败');
            bundleBtn.disabled = false;
            bundleBtn.textContent = oldText;
          }
        } catch (e) {
          showPayToast('解锁失败');
          bundleBtn.disabled = false;
          bundleBtn.textContent = oldText;
        }
      });
    }

    const closeBtn = $('destinyCloseBtn');
    if (closeBtn) {
      closeBtn.addEventListener('click', closeDestinyModal);
    }
  }

  // ==================== Ad Watching (激励视频模拟) ====================
  // 返回 Promise<boolean>，true 表示观看完成
  function watchAd(durationMs) {
    return new Promise((resolve) => {
      const overlay = $('adOverlay');
      const numEl = $('adCountdownNum');
      const closeBtn = $('adCloseBtn');
      if (!overlay || !numEl || !closeBtn) {
        // 没有广告 UI，直接放行（本地降级）
        resolve(true);
        return;
      }

      const totalSec = Math.max(5, Math.round(durationMs / 1000));
      let remaining = totalSec;
      numEl.textContent = remaining;
      closeBtn.disabled = true;
      closeBtn.textContent = `请观看 ${remaining}s`;
      overlay.classList.add('show');

      const timer = setInterval(() => {
        remaining -= 1;
        numEl.textContent = remaining;
        if (remaining > 0) {
          closeBtn.textContent = `请观看 ${remaining}s`;
        } else {
          clearInterval(timer);
          closeBtn.disabled = false;
          closeBtn.textContent = '领取奖励';
        }
      }, 1000);

      // 倒计时结束后点击"领取奖励"视为观看完成
      const handler = () => {
        if (closeBtn.disabled) return;
        clearInterval(timer);
        closeBtn.removeEventListener('click', handler);
        overlay.classList.remove('show');
        resolve(true);
      };
      closeBtn.addEventListener('click', handler);
    });
  }

  // 点击遮罩关闭命运轨迹
  $('destinyOverlay').addEventListener('click', (e) => {
    if (e.target === $('destinyOverlay')) {
      closeDestinyModal();
    }
  });

  // ==================== Nav Toggle ====================
  document.querySelectorAll('.nav-pill').forEach(pill => {
    pill.addEventListener('click', () => {
      navigateTo(pill.dataset.page);
    });
  });

  // ==================== Countdown Timer ====================
  let archivePollCounter = 0;
  setInterval(() => {
    archivePollCounter++;
    checkPendingReplies();
    if (state.currentPage === 'archive') {
      // 每 10 秒轮询一次后端记录，生成完成后自动刷新
      if (USE_API && archivePollCounter % 10 === 0) {
        apiGetRecords(state.openid).then(data => {
          state.records = data.records;
          renderArchive();
        }).catch(err => {
          console.error('[poll] 加载后端记录失败:', err);
        });
      }
      document.querySelectorAll('.countdown-block').forEach(el => {
        const replyAt = parseInt(el.dataset.replyAt);
        const remaining = replyAt - Date.now();
        if (remaining <= 0) {
          el.innerHTML = '✍️ 信件正在撰写中…';
        } else {
          let timeEl = el.querySelector('.countdown-time');
          if (!timeEl) {
            el.innerHTML = '⏳ 回信倒计时 <span class="countdown-time"></span>';
            timeEl = el.querySelector('.countdown-time');
          }
          if (timeEl) {
            timeEl.textContent = formatCountdown(remaining);
          }
        }
      });
    }
  }, 1000);

  // ==================== Init ====================
  seedDemoData();
  checkPendingReplies();
  navigateTo('release');

})();
</script>

</body>
</html>
