<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>赛博放生 · 单生物文字旅程</title>
<style>
  :root {
    --bg0: #060d14;
    --bg1: #0a1622;
    --bg2: #0f2130;
    --ink: #dce9f2;
    --ink-dim: #8fa8ba;
    --ink-faint: #5f7889;
    --coral: #ff7a59;
    --coral-soft: rgba(255, 122, 89, .16);
    --aqua: #57c8b2;
    --aqua-soft: rgba(87, 200, 178, .14);
    --gold: #ffd970;
    --line: rgba(143, 168, 186, .18);
    --glass: rgba(15, 33, 48, .72);
    --radius: 18px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(1200px 700px at 50% -10%, #10293c 0%, var(--bg0) 62%);
    color: var(--ink);
    font-family: "PingFang SC", "Noto Sans SC", "Microsoft YaHei", -apple-system, sans-serif;
    line-height: 1.6;
    overflow-x: hidden;
  }
  button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
  textarea, input { font-family: inherit; }
  ::selection { background: rgba(87,200,178,.35); }

  .app { max-width: 560px; margin: 0 auto; min-height: 100%; display: flex; flex-direction: column; }

  /* ===== header ===== */
  .topbar {
    display: flex; align-items: center; justify-content: space-between;
    padding: 18px 20px 10px;
  }
  .brand { font-size: 19px; font-weight: 700; letter-spacing: 1px; }
  .brand em { font-style: normal; color: var(--aqua); }
  .nav-pills { display: flex; gap: 6px; background: var(--glass); border: 1px solid var(--line); border-radius: 999px; padding: 4px; }
  .nav-pill { padding: 6px 16px; border-radius: 999px; font-size: 13px; color: var(--ink-dim); transition: all .2s; }
  .nav-pill.active { background: var(--aqua-soft); color: var(--aqua); font-weight: 600; }

  .view { display: none; flex: 1; padding: 10px 16px 40px; }
  .view.active { display: block; }

  /* ===== release: water canvas ===== */
  .water-canvas {
    position: relative; border-radius: var(--radius); overflow: hidden;
    border: 1px solid var(--line); background: #08131e;
    height: 320px; margin-bottom: 14px;
  }
  .globe-canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: none; }
  .water-canvas.has-3d.mode-3d .globe-canvas { display: block; }
  /* 3D 模式隐藏平面地图；2D 模式隐藏球体、恢复地图交互 */
  .water-canvas.has-3d.mode-3d .world-map { opacity: 0; pointer-events: none; }
  .water-canvas.has-3d:not(.mode-3d) .globe-canvas { display: none; }
  .world-map { position: absolute; inset: 0; transition: opacity .3s; }
  .map-svg { width: 100%; height: 100%; }
  .water-marker { cursor: pointer; }
  .water-marker .dot { fill: var(--aqua); }
  .water-marker .pulse { fill: rgba(87,200,178,.25); animation: pulse 2.4s infinite; }
  .water-marker.selected .dot { fill: var(--coral); }
  .water-marker.selected .pulse { fill: rgba(255,122,89,.3); }
  .water-label { fill: #cfe3ee; font-size: 11px; text-anchor: middle; paint-order: stroke; stroke: rgba(6,13,20,.8); stroke-width: 3px; }
  @keyframes pulse { 0% { r: 5; opacity: .9; } 70% { r: 12; opacity: 0; } 100% { r: 12; opacity: 0; } }
  .map-hint {
    position: absolute; left: 50%; bottom: 12px; transform: translateX(-50%);
    background: rgba(6,13,20,.72); border: 1px solid var(--line);
    padding: 5px 14px; border-radius: 999px; font-size: 12px; color: var(--ink-dim);
    white-space: nowrap;
  }
  .map-hint.hidden { display: none; }
  .style-toggle {
    position: absolute; top: 10px; right: 10px; z-index: 5;
    background: rgba(6,13,20,.72); border: 1px solid var(--line); border-radius: 999px;
    padding: 4px 12px; font-size: 12px; color: var(--ink-dim);
  }
  .river-stat {
    position: absolute; left: 12px; bottom: 12px; z-index: 4;
    background: rgba(6,13,20,.66); border: 1px solid var(--line); border-radius: 12px;
    padding: 8px 12px; font-size: 12px;
  }
  .stat-line .num { color: var(--aqua); font-weight: 600; }
  .stat-line.muted { color: var(--ink-faint); font-size: 11px; }

  /* ===== control panel ===== */
  .glass-panel {
    background: var(--glass); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px 16px;
    backdrop-filter: blur(8px);
  }
  .section-block { margin-bottom: 18px; }
  .section-block:last-child { margin-bottom: 0; }
  .section-label { font-size: 13px; font-weight: 600; color: var(--ink); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .label-num {
    display: inline-flex; align-items: center; justify-content: center;
    width: 18px; height: 18px; border-radius: 6px; background: var(--aqua-soft);
    color: var(--aqua); font-size: 11px; font-weight: 700;
  }
  .label-hint { font-weight: 400; color: var(--ink-faint); font-size: 11px; }
  .feeling-row { position: relative; }
  .feeling-textarea {
    width: 100%; background: rgba(6,13,20,.6); border: 1px solid var(--line);
    border-radius: 14px; color: var(--ink); font-size: 14px; padding: 12px 14px;
    resize: none; min-height: 64px; outline: none; transition: border .2s;
  }
  .feeling-textarea:focus { border-color: rgba(87,200,178,.55); }
  .feeling-hint { margin-top: 6px; font-size: 11px; color: var(--ink-faint); }
  .chip-row { display: flex; gap: 8px; flex-wrap: wrap; }
  .chip {
    padding: 8px 16px; border-radius: 999px; font-size: 13px;
    border: 1px solid var(--line); color: var(--ink-dim); background: rgba(6,13,20,.4);
    transition: all .2s;
  }
  .chip.active { border-color: var(--coral); color: var(--coral); background: var(--coral-soft); font-weight: 600; }
  .chip.aqua.active { border-color: var(--aqua); color: var(--aqua); background: var(--aqua-soft); }
  .redepart-box { margin-top: 10px; border-top: 1px dashed var(--line); padding-top: 12px; }
  .redepart-toggle { font-size: 12px; color: var(--ink-dim); display: flex; align-items: center; gap: 8px; }
  .redepart-toggle .switch {
    width: 34px; height: 20px; border-radius: 999px; background: rgba(95,120,137,.4); position: relative; transition: background .2s;
  }
  .redepart-toggle .switch::after {
    content: ''; position: absolute; width: 16px; height: 16px; border-radius: 50%;
    background: #fff; top: 2px; left: 2px; transition: left .2s;
  }
  .redepart-toggle.on .switch { background: var(--aqua); }
  .redepart-toggle.on .switch::after { left: 16px; }
  .redepart-list { display: none; margin-top: 10px; }
  .redepart-box.open .redepart-list { display: block; }
  .release-btn {
    width: 100%; padding: 14px; border-radius: 14px; font-size: 15px; font-weight: 700;
    background: linear-gradient(135deg, #ff9a76, var(--coral)); color: #241109;
    transition: opacity .2s, transform .1s; margin-top: 4px;
  }
  .release-btn:disabled { opacity: .35; }
  .release-btn:not(:disabled):active { transform: scale(.98); }
  .tone-note { font-size: 11px; color: var(--ink-faint); margin-top: 8px; }

  /* ===== mailbox ===== */
  .journey-chips { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 12px; scrollbar-width: none; }
  .journey-chips::-webkit-scrollbar { display: none; }
  .jchip {
    flex: 0 0 auto; display: flex; align-items: center; gap: 6px;
    padding: 7px 14px; border-radius: 999px; font-size: 12px;
    background: var(--glass); border: 1px solid var(--line); color: var(--ink-dim);
  }
  .jchip.active { border-color: var(--aqua); color: var(--aqua); background: var(--aqua-soft); }
  .jchip .dot { width: 7px; height: 7px; border-radius: 50%; background: var(--ink-faint); }
  .jchip .dot.live { background: var(--aqua); box-shadow: 0 0 8px rgba(87,200,178,.8); }
  .jchip .dot.done { background: var(--ink-faint); }
  .jchip .dot.paused { background: var(--gold); }

  .jhead { margin-bottom: 14px; }
  .jhead-main { display: flex; align-items: center; gap: 12px; margin-bottom: 10px; }
  .jhead-emoji { font-size: 34px; }
  .jhead-title { font-size: 17px; font-weight: 700; }
  .jhead-sub { font-size: 12px; color: var(--ink-dim); }
  .phase-badge {
    margin-left: auto; padding: 4px 12px; border-radius: 999px; font-size: 11px;
    border: 1px solid var(--line); color: var(--ink-dim); white-space: nowrap;
  }
  .phase-badge.live { color: var(--aqua); border-color: rgba(87,200,178,.5); background: var(--aqua-soft); }
  .phase-badge.warn { color: var(--gold); border-color: rgba(255,217,112,.5); background: rgba(255,217,112,.1); }
  .phase-badge.done { color: var(--ink-faint); }
  .goal-quote {
    background: rgba(6,13,20,.5); border: 1px solid var(--line); border-left: 3px solid var(--aqua);
    border-radius: 10px; padding: 10px 14px; font-size: 13px; color: var(--ink-dim); font-style: italic;
  }
  .goal-quote b { color: var(--aqua); font-style: normal; font-size: 11px; margin-right: 6px; }
  .jhead-note { font-size: 11px; color: var(--ink-faint); margin-top: 8px; }

  .signal-card {
    border: 1px solid rgba(255,122,89,.55); border-radius: var(--radius);
    background: linear-gradient(160deg, rgba(255,122,89,.12), rgba(15,33,48,.85));
    padding: 16px; margin-bottom: 14px;
  }
  .signal-tag { display: inline-flex; align-items: center; gap: 6px; font-size: 11px; color: var(--coral); font-weight: 700; margin-bottom: 8px; }
  .signal-tag .blink { width: 7px; height: 7px; border-radius: 50%; background: var(--coral); animation: blink 1.2s infinite; }
  @keyframes blink { 50% { opacity: .25; } }
  .signal-text { font-size: 14px; margin-bottom: 10px; }
  .signal-due { font-size: 11px; color: var(--ink-dim); margin-bottom: 12px; }
  .signal-due b { color: var(--gold); font-weight: 600; }
  .signal-actions { font-size: 11px; color: var(--ink-faint); margin-bottom: 12px; }
  .signal-reply { display: flex; gap: 8px; }
  .signal-reply textarea {
    flex: 1; background: rgba(6,13,20,.6); border: 1px solid var(--line); border-radius: 12px;
    color: var(--ink); font-size: 13px; padding: 10px 12px; resize: none; height: 44px; outline: none;
  }
  .signal-reply textarea:focus { border-color: rgba(255,122,89,.6); }
  .reply-btn { padding: 0 18px; border-radius: 12px; background: var(--coral); color: #241109; font-weight: 700; font-size: 13px; }
  .replied-note { font-size: 12px; color: var(--aqua); }

  .msg-list { display: flex; flex-direction: column; gap: 10px; }
  .msg-card { background: var(--glass); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px 16px; }
  .msg-card.final { border-color: rgba(255,217,112,.5); background: linear-gradient(160deg, rgba(255,217,112,.08), rgba(15,33,48,.85)); }
  .msg-card.system { border-style: dashed; opacity: .8; }
  .msg-card.signal-msg { border-left: 3px solid var(--coral); }
  .msg-card.user-reply { margin-left: 28px; background: rgba(87,200,178,.08); border-color: rgba(87,200,178,.3); }
  .msg-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; }
  .msg-kind { font-size: 10px; padding: 2px 8px; border-radius: 999px; border: 1px solid var(--line); color: var(--ink-faint); white-space: nowrap; }
  .msg-card.final .msg-kind { color: var(--gold); border-color: rgba(255,217,112,.5); }
  .msg-title { font-size: 13px; font-weight: 700; }
  .msg-time { margin-left: auto; font-size: 10px; color: var(--ink-faint); white-space: nowrap; }
  .msg-text { font-size: 14px; white-space: pre-wrap; word-break: break-word; }
  .msg-img { margin-top: 10px; border-radius: 12px; width: 100%; display: block; }
  .msg-badge { font-size: 10px; color: var(--ink-faint); margin-top: 6px; }
  .msg-badge.warn { color: var(--gold); }

  /* ===== journey timeline ===== */
  .tl-toggle { width: 100%; margin-bottom: 14px; padding: 11px; }
  .timeline { position: relative; margin: 4px 0 16px 8px; padding-left: 24px; }
  .timeline::before {
    content: ''; position: absolute; left: 8px; top: 8px; bottom: 8px; width: 2px;
    background: linear-gradient(180deg, var(--aqua), rgba(87,200,178,.12)); border-radius: 2px;
  }
  .tl-node { position: relative; margin-bottom: 12px; }
  .tl-node::before {
    content: ''; position: absolute; left: -24px; top: 14px; width: 11px; height: 11px;
    border-radius: 50%; background: var(--bg1); border: 2px solid var(--aqua); box-sizing: border-box;
  }
  .tl-node.encounter::before { border-color: var(--coral); }
  .tl-node.letter::before, .tl-node.final_letter::before { border-color: var(--gold); }
  .tl-node.system::before { border-color: var(--ink-faint); }
  .tl-node.ending::before { border-color: var(--gold); background: rgba(255,217,112,.35); }
  .tl-card { background: var(--glass); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
  .tl-node.final_letter .tl-card { border-color: rgba(255,217,112,.5); background: linear-gradient(160deg, rgba(255,217,112,.08), rgba(15,33,48,.85)); }
  .tl-node.encounter .tl-card { border-left: 3px solid var(--coral); }
  .tl-node.system { opacity: .72; }
  .tl-node.system .tl-card { border-style: dashed; }
  .tl-head { display: flex; align-items: baseline; gap: 8px; margin-bottom: 6px; flex-wrap: wrap; }
  .tl-kind { font-size: 10px; font-weight: 700; color: var(--aqua); white-space: nowrap; letter-spacing: .5px; }
  .tl-node.encounter .tl-kind { color: var(--coral); }
  .tl-node.letter .tl-kind, .tl-node.final_letter .tl-kind, .tl-node.ending .tl-kind { color: var(--gold); }
  .tl-time { margin-left: auto; font-size: 10px; color: var(--ink-faint); white-space: nowrap; }
  .tl-title { font-size: 13px; font-weight: 700; margin-right: 4px; }
  .tl-text { font-size: 13.5px; white-space: pre-wrap; word-break: break-word; }
  .tl-sub { font-size: 12px; color: var(--ink-dim); margin-top: 4px; }
  .tl-choice {
    margin: 8px 0 2px; padding: 8px 12px; border-left: 3px solid var(--coral);
    background: rgba(255,122,89,.08); border-radius: 8px; font-size: 12.5px;
  }
  .tl-choice b { color: var(--coral); }
  .tl-facts { margin-top: 6px; font-size: 11.5px; color: var(--ink-faint); line-height: 1.7; }
  .tl-img { margin-top: 10px; border-radius: 10px; width: 100%; display: block; }
  .tl-badge { font-size: 10px; color: var(--ink-faint); border: 1px solid var(--line); border-radius: 999px; padding: 1px 8px; }
  .tl-badge.warn { color: var(--gold); border-color: rgba(255,217,112,.4); }

  .empty-box { text-align: center; padding: 60px 20px; color: var(--ink-dim); }
  .empty-box .big { font-size: 44px; margin-bottom: 12px; }
  .empty-box p { font-size: 13px; margin-bottom: 16px; }
  .btn-line {
    padding: 9px 22px; border-radius: 999px; border: 1px solid var(--line);
    color: var(--ink-dim); font-size: 13px;
  }
  .btn-line:hover { border-color: var(--aqua); color: var(--aqua); }
  .jfoot { display: flex; align-items: center; gap: 10px; margin-top: 18px; justify-content: space-between; flex-wrap: wrap; }
  .tone-inline { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--ink-faint); flex-wrap: wrap; }
  .end-link { font-size: 12px; color: var(--ink-faint); text-decoration: underline; text-underline-offset: 3px; }
  .end-link:hover { color: var(--coral); }

  /* ===== overlays ===== */
  .overlay {
    position: fixed; inset: 0; background: rgba(4, 9, 14, .78); z-index: 50;
    display: none; align-items: center; justify-content: center; padding: 20px;
    backdrop-filter: blur(4px);
  }
  .overlay.show { display: flex; }
  .receipt-card {
    width: 100%; max-width: 360px; background: var(--bg2); border: 1px solid var(--line);
    border-radius: 22px; padding: 30px 24px; text-align: center;
    animation: rise .35s ease;
  }
  @keyframes rise { from { transform: translateY(18px); opacity: 0; } to { transform: none; opacity: 1; } }
  .receipt-emoji { font-size: 52px; margin-bottom: 10px; }
  .receipt-title { font-size: 18px; font-weight: 700; margin-bottom: 8px; }
  .receipt-sub { font-size: 13px; color: var(--ink-dim); margin-bottom: 20px; }
  .receipt-actions { display: flex; gap: 10px; justify-content: center; }
  .btn-primary {
    padding: 10px 24px; border-radius: 999px; background: var(--aqua); color: #06231d; font-weight: 700; font-size: 13px;
  }
  .toast {
    position: fixed; left: 50%; bottom: 34px; transform: translateX(-50%) translateY(20px);
    background: rgba(15,33,48,.95); border: 1px solid var(--line); color: var(--ink);
    padding: 10px 20px; border-radius: 999px; font-size: 13px; z-index: 99;
    opacity: 0; transition: all .25s; pointer-events: none; max-width: 86vw; text-align: center;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .loading-dots::after { content: '…'; animation: dots 1.4s steps(4) infinite; }
  @keyframes dots { 0% { content: ''; } 25% { content: '·'; } 50% { content: '··'; } 75% { content: '···'; } }

  @media (min-width: 700px) {
    .water-canvas { height: 380px; }
  }
</style>
</head>
<body>
<div class="app">
  <header class="topbar">
    <div class="brand">赛博<em>放生</em></div>
    <nav class="nav-pills">
      <button class="nav-pill active" data-page="release">放生</button>
      <button class="nav-pill" data-page="mailbox">信箱</button>
    </nav>
  </header>

  <!-- 放生 -->
  <section class="view active" id="releaseView">
    <div class="water-canvas" id="waterCanvasBox">
      <canvas class="globe-canvas" id="globeCanvas"></canvas>
      <div class="world-map" id="worldMap">
        <svg class="map-svg" viewBox="0 0 640 480" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
          <defs>
            <linearGradient id="oceanGrad" x1="0" y1="0" x2="0" y2="1">
              <stop offset="0%" stop-color="#12283a"/>
              <stop offset="60%" stop-color="#0d1f30"/>
              <stop offset="100%" stop-color="#081420"/>
            </linearGradient>
          </defs>
          <rect width="640" height="480" fill="url(#oceanGrad)"/>
          <g fill="#16354a" stroke="#1e4258" stroke-width="0.6">
            <path d="M 50 70 Q 90 50 150 65 Q 190 80 195 120 Q 185 160 160 180 Q 120 195 85 180 Q 55 160 45 120 Q 40 90 50 70 Z"/>
            <path d="M 130 230 Q 165 220 185 250 Q 195 290 185 330 Q 170 370 150 365 Q 125 340 120 300 Q 120 260 130 230 Z"/>
            <path d="M 200 40 Q 230 30 250 45 Q 255 65 240 75 Q 215 75 200 60 Z"/>
            <path d="M 260 75 Q 330 55 420 70 Q 500 85 545 120 Q 555 155 530 180 Q 480 195 420 190 Q 360 185 310 170 Q 270 155 255 125 Q 250 95 260 75 Z"/>
            <path d="M 285 95 Q 300 88 308 100 Q 305 115 292 113 Q 283 105 285 95 Z"/>
            <path d="M 540 130 Q 555 125 560 140 Q 555 155 545 150 Q 538 140 540 130 Z"/>
            <path d="M 335 210 Q 370 200 395 225 Q 405 265 395 305 Q 380 340 360 340 Q 335 325 325 290 Q 320 250 335 210 Z"/>
            <path d="M 500 220 Q 520 215 530 230 Q 525 245 510 243 Q 498 235 500 220 Z"/>
            <path d="M 495 335 Q 535 325 560 345 Q 565 375 545 390 Q 515 392 498 378 Q 488 355 495 335 Z"/>
          </g>
          <g id="waterMarkers"></g>
        </svg>
      </div>
      <div class="map-hint" id="mapHint">转动地球 · 点选放生水域</div>
      <button class="style-toggle" id="globeModeBtn" type="button"></button>
      <div class="river-stat">
        <div class="stat-line">已选 · <span class="num" id="selectedWater">未选择</span></div>
        <div class="stat-line muted" id="worldPulseLine">此刻世界上有 <span id="worldAliveCount">…</span> 段旅程在水里</div>
      </div>
    </div>

    <div class="control-panel">
      <div class="glass-panel">
        <div class="section-block">
          <div class="section-label"><span class="label-num">1</span>写下一件具体的烦恼 <span class="label-hint">（它会成为这只生物本程的动机）</span></div>
          <div class="feeling-row">
            <textarea class="feeling-textarea" id="feelingText" rows="3" maxlength="500" placeholder="例如：谁找我帮忙我都答应，最后只有我自己的事没做完……"></textarea>
          </div>
          <div class="feeling-hint"><span>·</span> 写得越具体，它记得越清楚</div>
        </div>

        <div class="section-block">
          <div class="section-label"><span class="label-num">2</span>想放生一只</div>
          <div class="chip-row" id="creatureChips">
            <button class="chip coral" data-creature="koi">🐟 锦鲤</button>
            <button class="chip coral" data-creature="turtle">🐢 乌龟</button>
            <button class="chip coral" data-creature="cloud">☁️ 云朵</button>
          </div>
          <div class="redepart-box" id="redepartBox">
            <button class="redepart-toggle" id="redepartToggle" type="button">
              <span class="switch"></span>
              <span>让一只放生过的生物再次出发（同一只，新的旅程）</span>
            </button>
            <div class="redepart-list chip-row" id="redepartList"></div>
          </div>
        </div>

        <div class="section-block">
          <div class="section-label"><span class="label-num">3</span>这程的故事，你想它讲得</div>
          <div class="chip-row" id="toneChips">
            <button class="chip aqua" data-tone="gentle">轻一点</button>
            <button class="chip aqua active" data-tone="balanced">荒诞但温和</button>
            <button class="chip aqua" data-tone="absurd">更荒唐一点</button>
          </div>
          <div class="tone-note">只影响之后的遭遇与文风；它自己的决定和已经发生的事不会被改写。</div>
        </div>

        <button class="release-btn" id="releaseBtn" disabled>选好啦 · 按下放生</button>
      </div>
    </div>
  </section>

  <!-- 信箱 -->
  <section class="view" id="mailboxView">
    <div class="journey-chips" id="journeyChips"></div>
    <div id="mailboxBody"></div>
  </section>
</div>

<!-- 放生回执 -->
<div class="overlay" id="receiptOverlay">
  <div class="receipt-card">
    <div class="receipt-emoji" id="receiptEmoji">🐟</div>
    <div class="receipt-title">已放生 · 准备出发</div>
    <div class="receipt-sub" id="receiptSub">它正在熟悉这片水域。你不用守在页面旁，有了动静它会写信到这里。</div>
    <div class="receipt-actions">
      <button class="btn-line" id="receiptHome">回首页</button>
      <button class="btn-primary" id="receiptMailbox">去看信箱</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/vendor/three.min.js" onerror="this.remove()"></script>
<script>
  // Bloom 后处理（可选：缺失时 globe3d 自动降级普通渲染）
  document.write('<script src="/vendor/EffectComposer.js"><\/script>');
  document.write('<script src="/vendor/RenderPass.js"><\/script>');
  document.write('<script src="/vendor/ShaderPass.js"><\/script>');
  document.write('<script src="/vendor/UnrealBloomPass.js"><\/script>');
  document.write('<script src="/vendor/CopyShader.js"><\/script>');
  document.write('<script src="/vendor/LuminosityHighPassShader.js"><\/script>');
</script>
<script src="/globe3d.js?v=16"></script>
<script>
(function () {
  'use strict';
  var $ = function (id) { return document.getElementById(id); };

  // ==================== 安全渲染 ====================
  function esc(s) {
    return String(s == null ? '' : s)
      .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }

  function toast(text) {
    var t = $('toast');
    t.textContent = text;
    t.classList.add('show');
    clearTimeout(toast._timer);
    toast._timer = setTimeout(function () { t.classList.remove('show'); }, 2600);
  }

  function fmtTime(ts) {
    var d = new Date(ts);
    var p = function (n) { return String(n).padStart(2, '0'); };
    return (d.getMonth() + 1) + '月' + d.getDate() + '日 ' + p(d.getHours()) + ':' + p(d.getMinutes());
  }

  function fmtDuration(ms) {
    if (ms <= 0) return '已到期';
    var s = Math.floor(ms / 1000);
    if (s < 60) return s + ' 秒';
    var m = Math.floor(s / 60);
    if (m < 60) return m + ' 分 ' + (s % 60) + ' 秒';
    var h = Math.floor(m / 60);
    return h + ' 小时 ' + (m % 60) + ' 分';
  }

  // ==================== 状态 ====================
  var WATERS = {
    pacific: '太平洋', atlantic: '大西洋', indian: '印度洋', arctic: '北冰洋',
    baikal: '贝加尔湖', ness: '尼斯湖', xihu: '西湖', xiang: '湘江',
    mariana: '马里亚纳海沟', deadsea: '死海', aegean: '爱琴海', galapagos: '加拉帕戈斯'
  };
  var PLACEHOLDERS = [
    '明天要答辩，紧张到胃疼…',
    '又加班到十一点，脑子嗡嗡的…',
    '谁找我帮忙我都答应，最后只有我的事没做完…',
    '凌晨三点了还是睡不着，想太多…'
  ];

  var state = {
    page: 'release',
    feeling: '',
    creature: null,          // koi | turtle | cloud
    water: null,
    tone: 'balanced',
    redepartOpen: false,
    redepartCreatureId: null,
    creatures: [],
    journeys: [],
    currentJourneyId: null,
    journey: null,           // 当前旅程视图缓存
    isReleased: false,
    globeActive: false,
    pollTimer: null,
    countdownTimer: null
  };

  // ==================== API ====================
  function api(path, opts) {
    opts = opts || {};
    return fetch(path, {
      method: opts.method || 'GET',
      headers: opts.body ? { 'Content-Type': 'application/json' } : undefined,
      body: opts.body ? JSON.stringify(opts.body) : undefined,
      credentials: 'same-origin'
    }).then(function (r) {
      return r.json().then(function (data) { return { status: r.status, data: data }; })
        .catch(function () { return { status: r.status, data: {} }; });
    });
  }

  // ==================== 页面切换 ====================
  function switchPage(page) {
    state.page = page;
    document.querySelectorAll('.nav-pill').forEach(function (p) {
      p.classList.toggle('active', p.dataset.page === page);
    });
    $('releaseView').classList.toggle('active', page === 'release');
    $('mailboxView').classList.toggle('active', page === 'mailbox');
    if (page === 'mailbox') refreshMailbox();
    if (page === 'release') startPulse();
    stopPolling();
    if (page === 'mailbox' && state.currentJourneyId) startPolling();
  }

  document.querySelectorAll('.nav-pill').forEach(function (p) {
    p.addEventListener('click', function () { switchPage(p.dataset.page); });
  });

  // ==================== 2D 地图水域标记 ====================
  var MARKER_POS = {
    pacific: [590, 200], atlantic: [225, 180], indian: [460, 340], arctic: [340, 25],
    baikal: [450, 120], ness: [295, 90], xihu: [515, 155], xiang: [505, 175],
    mariana: [600, 275], deadsea: [395, 198], aegean: [350, 188], galapagos: [95, 260]
  };
  function renderMarkers() {
    var g = $('waterMarkers');
    var html = '';
    Object.keys(MARKER_POS).forEach(function (id) {
      var pos = MARKER_POS[id];
      html += '<g class="water-marker ' + (state.water === id ? 'selected' : '') + '" data-water="' + id + '" transform="translate(' + pos[0] + ',' + pos[1] + ')">' +
        '<circle class="pulse" r="7"/><circle class="dot" r="5"/>' +
        '<text class="water-label" y="-12">' + esc(WATERS[id]) + '</text></g>';
    });
    g.innerHTML = html;
    g.querySelectorAll('.water-marker').forEach(function (m) {
      m.addEventListener('click', function () { selectWater(m.dataset.water); });
    });
  }

  function selectWater(id) {
    if (state.isReleased) return;
    state.water = id;
    if (state.globeActive && window.Globe3D) Globe3D.focusWater(id);
    if (state.globeActive && window.Globe3D) Globe3D.setMarkersState(id);
    renderMarkers();
    $('selectedWater').textContent = WATERS[id];
    $('mapHint').classList.add('hidden');
    updateReleaseBtn();
  }

  // ==================== 3D 地球 ====================
  window.__globeConfigReady = fetch('/globe-config.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (cfg) { if (window.Globe3D) Globe3D.loadConfig(cfg); return cfg; })
    .catch(function () { return null; });
  window.__worldLandReady = fetch('/world-land.json').then(function (r) { return r.ok ? r.json() : Promise.reject(); })
    .then(function (wl) { if (window.Globe3D) Globe3D.setWorldLand(wl); return wl; })
    .catch(function () { return null; });

  function loadEarthTextures() {
    if (typeof THREE === 'undefined') return Promise.resolve(null);
    var loader = new THREE.TextureLoader();
    loader.setCrossOrigin('anonymous');
    var load = function (url) {
      return new Promise(function (res) {
        loader.load(url, function (t) { res(t); }, undefined, function () { res(null); });
        setTimeout(function () { res(null); }, 15000);
      });
    };
    var base = '/vendor/textures/';
    return Promise.all([
      load(base + 'earth-blue-marble.jpg'), load(base + 'earth-night.jpg'),
      load(base + 'earth-water.png'), load(base + 'clouds.png')
    ]).then(function (arr) { return arr[0] ? { day: arr[0], night: arr[1], water: arr[2], clouds: arr[3] } : null; });
  }

  function initGlobe() {
    var canvas = $('globeCanvas');
    var box = $('waterCanvasBox');
    if (!canvas || !box || typeof Globe3D === 'undefined') return Promise.resolve();
    return Promise.all([window.__globeConfigReady, window.__worldLandReady]).catch(function () {})
      .then(loadEarthTextures)
      .then(function (textures) {
        var ok = Globe3D.init({
          canvas: canvas,
          textures: textures,
          onSelect: function (waterId) { selectWater(waterId); },
          disabled: function () { return state.isReleased; }
        });
        if (!ok) return;
        state.globeActive = true;
        box.classList.add('has-3d');
        var curMode = function () { return localStorage.getItem('globe_mode') === '2d' ? '2d' : '3d'; };
        var applyMode = function (mode) {
          var is3d = mode === '3d';
          box.classList.toggle('mode-3d', is3d);
          if (Globe3D.setPaused) Globe3D.setPaused(!is3d);
          $('globeModeBtn').textContent = is3d ? '🗺️ 2D' : '🌐 3D';
          var h = $('mapHint');
          h.style.visibility = 'visible';
          h.textContent = is3d ? '转动地球 · 点选放生水域' : '点选水域';
          h.classList.toggle('hidden', !!state.water);
        };
        applyMode(curMode());
        $('globeModeBtn').addEventListener('click', function (e) {
          e.stopPropagation();
          var next = curMode() === '3d' ? '2d' : '3d';
          localStorage.setItem('globe_mode', next);
          applyMode(next);
        });
      });
  }

  // ==================== 世界脉搏（无他人原话） ====================
  var pulseTimer = null;
  function startPulse() {
    if (pulseTimer) return;
    fetchPulse();
    pulseTimer = setInterval(fetchPulse, 30000);
  }
  function fetchPulse() {
    api('/api/world/pulse').then(function (r) {
      if (!r.data || typeof r.data.total !== 'number') return;
      var el = $('worldAliveCount');
      if (el) el.textContent = r.data.total.toLocaleString();
    }).catch(function () {});
  }

  // ==================== 放生表单 ====================
  var placeholderIdx = 0;
  setInterval(function () {
    var ta = $('feelingText');
    if (ta && document.activeElement !== ta && !ta.value) {
      ta.placeholder = PLACEHOLDERS[placeholderIdx = (placeholderIdx + 1) % PLACEHOLDERS.length];
    }
  }, 4000);

  $('feelingText').addEventListener('input', function () {
    state.feeling = this.value;
    updateReleaseBtn();
  });
  $('creatureChips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    selectCreature(chip.dataset.creature, null);
  });
  function selectCreature(species, creatureId) {
    state.creature = species;
    state.redepartCreatureId = creatureId || null;
    document.querySelectorAll('#creatureChips .chip').forEach(function (c) {
      c.classList.toggle('active', !creatureId && c.dataset.creature === species);
    });
    document.querySelectorAll('#redepartList .chip').forEach(function (c) {
      c.classList.toggle('active', creatureId && c.dataset.creatureId === creatureId);
    });
    updateReleaseBtn();
  }
  $('toneChips').addEventListener('click', function (e) {
    var chip = e.target.closest('.chip');
    if (!chip) return;
    state.tone = chip.dataset.tone;
    document.querySelectorAll('#toneChips .chip').forEach(function (c) {
      c.classList.toggle('active', c.dataset.tone === state.tone);
    });
  });
  $('redepartToggle').addEventListener('click', function () {
    state.redepartOpen = !state.redepartOpen;
    $('redepartBox').classList.toggle('open', state.redepartOpen);
    $('redepartToggle').classList.toggle('on', state.redepartOpen);
    if (!state.redepartOpen) selectCreature(state.creature, null);
    else if (state.creatures.length && !state.redepartCreatureId) {
      var c = state.creatures[state.creatures.length - 1];
      selectCreature(c.species, c.id);
    }
  });

  function updateReleaseBtn() {
    var ready = state.feeling.trim() && state.creature && state.water && !state.isReleased;
    var btn = $('releaseBtn');
    btn.disabled = !ready;
    btn.textContent = state.isReleased ? '正在放生…' : (ready ? '按下放生' : '选好啦 · 按下放生');
  }

  function loadCreatures() {
    return api('/api/creatures').then(function (r) {
      state.creatures = (r.data && r.data.creatures) || [];
      renderRedepartList();
    }).catch(function () {});
  }
  function renderRedepartList() {
    var box = $('redepartBox');
    if (!state.creatures.length) { box.style.display = 'none'; return; }
    box.style.display = '';
    var html = '';
    state.creatures.forEach(function (c) {
      html += '<button class="chip aqua' + (state.redepartCreatureId === c.id ? ' active' : '') + '" data-creature-id="' + esc(c.id) + '" data-species="' + esc(c.species) + '">' +
        esc(c.creatureEmoji) + ' ' + esc(c.creatureName) + ' · ' + c.journeyCount + '程</button>';
    });
    $('redepartList').innerHTML = html;
    $('redepartList').querySelectorAll('.chip').forEach(function (chip) {
      chip.addEventListener('click', function () {
        selectCreature(chip.dataset.species, chip.dataset.creatureId);
      });
    });
  }

  $('releaseBtn').addEventListener('click', function () {
    if (state.isReleased) return;
    if (!state.feeling.trim() || !state.creature || !state.water) return;
    state.isReleased = true;
    updateReleaseBtn();
    var body = {
      species: state.creature,
      water: state.water,
      feeling: state.feeling.trim(),
      tone: state.tone
    };
    if (state.redepartCreatureId) body.creatureId = state.redepartCreatureId;
    if (state.globeActive && window.Globe3D && Globe3D.playRelease) {
      Globe3D.playRelease({ creature: state.creature, water: state.water }).catch(function () {});
    }
    api('/api/release', { method: 'POST', body: body }).then(function (r) {
      state.isReleased = false;
      updateReleaseBtn();
      if (r.status !== 200 || !r.data.ok) {
        toast('放生没有成功：' + (r.data.code === 'feeling_too_long' ? '写得太多啦（500 字以内）' : (r.data.error || '稍后再试')));
        return;
      }
      var c = r.data.creature;
      $('receiptEmoji').textContent = c.emoji;
      $('receiptSub').textContent = (c.isNew ? '一只' : '这只') + c.name + '正在熟悉' + r.data.waterName + '。你不用守在页面旁，有了动静它会写信到这里。';
      $('receiptOverlay').classList.add('show');
      state.feeling = '';
      $('feelingText').value = '';
      state.currentJourneyId = r.data.journeyId;
      loadCreatures();
    }).catch(function () {
      state.isReleased = false;
      updateReleaseBtn();
      toast('网络不太顺畅，稍后再试');
    });
  });

  $('receiptHome').addEventListener('click', function () {
    $('receiptOverlay').classList.remove('show');
  });
  $('receiptMailbox').addEventListener('click', function () {
    $('receiptOverlay').classList.remove('show');
    switchPage('mailbox');
  });

  // ==================== 信箱 ====================
  var PHASE_TEXT = {
    preparing: ['准备出发', 'live'],
    journeying: ['旅途中', 'live'],
    awaiting_reply: ['等你的回应', 'warn'],
    experiencing: ['正在经历', 'live'],
    paused: ['暂停', 'warn'],
    ended: ['已结束', 'done']
  };

  function refreshMailbox() {
    return api('/api/journeys').then(function (r) {
      state.journeys = (r.data && r.data.journeys) || [];
      renderJourneyChips();
      var target = state.currentJourneyId && state.journeys.find(function (j) { return j.id === state.currentJourneyId; })
        ? state.currentJourneyId
        : (state.journeys.find(function (j) { return ['preparing', 'active', 'paused'].includes(j.status); }) || state.journeys[0] || {}).id;
      if (target) return loadJourney(target);
      renderMailboxEmpty();
    }).catch(function () {});
  }

  function renderJourneyChips() {
    var box = $('journeyChips');
    if (!state.journeys.length) { box.innerHTML = ''; return; }
    var html = '';
    state.journeys.forEach(function (j) {
      var dot = ['preparing', 'active', 'paused'].includes(j.status) ? 'live' : 'done';
      if (j.status === 'paused') dot = 'paused';
      html += '<button class="jchip' + (j.id === state.currentJourneyId ? ' active' : '') + '" data-jid="' + esc(j.id) + '">' +
        '<span class="dot ' + dot + '"></span>' + esc(j.creatureEmoji) + ' ' + esc(j.waterName) + ' · ' + esc(PHASE_TEXT[j.phase] ? PHASE_TEXT[j.phase][0] : j.status) +
        '</button>';
    });
    box.innerHTML = html;
    box.querySelectorAll('.jchip').forEach(function (chip) {
      chip.addEventListener('click', function () { loadJourney(chip.dataset.jid); });
    });
  }

  function loadJourney(id) {
    state.currentJourneyId = id;
    renderJourneyChips();
    return api('/api/journey/' + encodeURIComponent(id)).then(function (r) {
      if (r.status === 404) { toast('找不到这段旅程'); return; }
      state.journey = r.data.journey;
      renderMailbox();
      stopPolling();
      if (state.journey && ['preparing', 'active', 'paused'].includes(state.journey.status)) startPolling();
    });
  }

  function startPolling() {
    stopPolling();
    state.pollTimer = setInterval(function () {
      if (document.hidden || state.page !== 'mailbox' || !state.currentJourneyId) return;
      api('/api/journey/' + encodeURIComponent(state.currentJourneyId)).then(function (r) {
        if (r.data && r.data.journey) {
          var prevSignalReplied = state.journey && state.journey.pendingSignal && state.journey.pendingSignal.replied;
          state.journey = r.data.journey;
          renderMailbox();
          var msgs = state.journey.messages || [];
          var latest = msgs[msgs.length - 1];
          if (!prevSignalReplied && state.journey.pendingSignal && state.journey.pendingSignal.replied) {
            toast('回应已送达，它在决定了');
          }
        }
      }).catch(function () {});
    }, 15000);
  }
  function stopPolling() {
    if (state.pollTimer) { clearInterval(state.pollTimer); state.pollTimer = null; }
  }

  function renderMailboxEmpty() {
    $('mailboxBody').innerHTML =
      '<div class="empty-box"><div class="big">🌊</div>' +
      '<p>还没有生物出发。去放一只，把你的烦恼交给它带走。</p>' +
      '<button class="btn-line" id="emptyGo">去放生</button></div>';
    $('emptyGo').addEventListener('click', function () { switchPage('release'); });
  }

  function phaseBadge(j) {
    var ph = PHASE_TEXT[j.phase] || [j.phase, ''];
    return '<span class="phase-badge ' + ph[1] + '">' + esc(ph[0]) + '</span>';
  }

  function msgKindLabel(kind, meta) {
    if (kind === 'letter') return '经历来信';
    if (kind === 'final_letter') return '收束来信';
    if (kind === 'signal') return '信号';
    if (kind === 'user_reply') return '你说的话';
    if (kind === 'system') return '服务提示';
    return kind;
  }

  function renderMessages(msgs) {
    if (!msgs.length) return '';
    return '<div class="msg-list">' + msgs.map(function (m) {
      var cls = 'msg-card ' + (m.kind === 'final_letter' ? 'final' : '') + (m.kind === 'system' ? ' system' : '') + (m.kind === 'signal' ? ' signal-msg' : '') + (m.kind === 'user_reply' ? ' user-reply' : '');
      var html = '<div class="' + cls + '">' +
        '<div class="msg-head"><span class="msg-kind">' + esc(msgKindLabel(m.kind, m.meta)) + '</span>' +
        (m.title ? '<span class="msg-title">' + esc(m.title) + '</span>' : '') +
        '<span class="msg-time">' + fmtTime(m.sentAt) + '</span></div>' +
        '<div class="msg-text">' + esc(m.text) + '</div>';
      if (m.kind === 'signal' && m.status === 'expired') {
        html += '<div class="msg-badge">（你没来得及回，它自己做了决定）</div>';
      }
      if (m.kind === 'user_reply' && m.meta && m.meta.late) {
        html += '<div class="msg-badge warn">来晚了 · 只作为它之后面对未决之事的参考</div>';
      }
      if (m.image) {
        html += '<img class="msg-img" src="' + esc(m.image) + '" alt="旅程配图" loading="lazy">';
      } else if (m.imageStatus === 'pending' || m.imageStatus === 'failed') {
        html += '<div class="msg-badge">配图' + (m.imageStatus === 'failed' ? '没有生成成功，文字不受影响' : '正在路上…') + '</div>';
      }
      if (m.meta && m.meta.isFinal) {
        html += '<div class="msg-badge">这一程到这里结束了。它随时可以再次出发。</div>';
      }
      html += '</div>';
      return html;
    }).join('') + '</div>';
  }

  function tlKindLabel(node) {
    switch (node.kind) {
      case 'opening': return '🎯 开局';
      case 'encounter': return '⚔️ 第 ' + node.seq + ' 站';
      case 'signal': return '📡 信号';
      case 'user_reply': return '💬 你捎的话';
      case 'letter': return '✉️ 经历来信';
      case 'final_letter': return '✉️ 收束来信';
      case 'system': return '⚙️ 服务提示';
      case 'ending': return '🏁 收束';
      return node.kind;
    }
  }

  function renderTimeline(nodes) {
    var html = '<div class="timeline">';
    nodes.forEach(function (n) {
      var cls = 'tl-node ' + n.kind;
      html += '<div class="' + cls + '"><div class="tl-card">';
      html += '<div class="tl-head"><span class="tl-kind">' + tlKindLabel(n) + '</span>' +
        (n.title ? '<span class="tl-title">' + esc(n.title) + '</span>' : '') +
        '<span class="tl-time">' + fmtTime(n.at) + '</span></div>';
      if (n.kind === 'opening') {
        if (n.goal) html += '<div class="goal-quote" style="margin-bottom:6px;"><b>它的目标</b>' + esc(n.goal) + '</div>';
        html += '<div class="tl-sub">' + esc(n.creatureEmoji) + ' ' + esc(n.creatureName) + ' · ' + esc(n.waterName);
        if (n.motivation) {
          html += '<br>放生时写下：「' + esc(n.motivation.rawText) + '」';
          if (n.motivation.items && n.motivation.items.length) {
            html += '<br>它记住的处境：' + n.motivation.items.map(esc).join('、');
          }
        }
        html += '</div>';
      } else if (n.kind === 'encounter') {
        if (n.situation) html += '<div class="tl-sub" style="margin-bottom:6px;">' + esc(n.situation) + '</div>';
        if (n.settled) {
          html += '<div class="tl-choice">它选择了 <b>' + esc(n.chosenAction) + '</b>' +
            (n.chosenCost ? '（代价：' + esc(n.chosenCost) + '）' : '') + '</div>';
          if (n.narrative) html += '<div class="tl-text">' + esc(n.narrative) + '</div>';
          if (n.outcomeFacts && n.outcomeFacts.length) {
            html += '<div class="tl-facts">' + n.outcomeFacts.map(function (f) { return '<div>' + esc(f) + '</div>'; }).join('') + '</div>';
          }
        } else {
          html += '<div class="tl-sub">' + esc(n.unresolvedNote || '这件事没有落定。') + '</div>';
        }
      } else if (n.kind === 'ending') {
        html += '<div class="tl-text">' + esc(n.reasonText) + '。</div>';
      } else {
        // signal / letter / final_letter / user_reply / system
        html += '<div class="tl-text">' + esc(n.text) + '</div>';
        var badges = [];
        if (n.kind === 'signal' && n.status === 'expired') badges.push('你没来得及回，它自己做了决定');
        if (n.late) badges.push('来晚了 · 只作了参考');
        if (n.isFinal) badges.push('最后一封');
        if (n.imageStatus === 'failed') badges.push('配图未生成，文字不受影响');
        if (badges.length) {
          html += '<div style="margin-top:6px;">' + badges.map(function (b) { return '<span class="tl-badge warn">' + esc(b) + '</span>'; }).join(' ') + '</div>';
        }
        if (n.image) html += '<img class="tl-img" src="' + esc(n.image) + '" alt="旅程配图" loading="lazy">';
      }
      html += '</div></div>';
    });
    html += '</div>';
    return html;
  }

  function renderMailbox() {
    var j = state.journey;
    if (!j) { renderMailboxEmpty(); return; }
    var body = $('mailboxBody');

    var html = '<div class="jhead"><div class="jhead-main">' +
      '<div class="jhead-emoji">' + esc(j.creatureEmoji) + '</div>' +
      '<div><div class="jhead-title">' + esc(j.creatureName) + ' · ' + esc(j.waterName) + '</div>' +
      '<div class="jhead-sub">第 ' + j.eventCount + ' 段经历 · ' + (j.motivation && j.motivation.status === 'recognized' ? '动机已记下' : (j.motivation && j.motivation.status === 'degraded' ? '动机识别暂不可用' : (j.motivation && j.motivation.status === 'insufficient_evidence' ? '原话已记下（没有足够证据确认具体处境）' : '动机准备中'))) + '</div></div>' +
      phaseBadge(j) + '</div>';

    if (j.goal) {
      html += '<div class="goal-quote"><b>它的目标</b>' + esc(j.goal) + '</div>';
    } else if (j.phase === 'preparing') {
      html += '<div class="goal-quote"><b>状态</b><span class="loading-dots">正在熟悉水域、整理你写下的话</span></div>';
    }
    if (j.pauseReason) {
      html += '<div class="jhead-note">⏸ 服务暂停（' + esc(j.pauseReason) + '）：模型服务或预算暂时不可用，这不是它自己停下来。</div>';
    }
    html += '</div>';

    // 旅程回顾：结束后才可展开（进行中全量公开会取消它自己选择来信时机的意义）
    if (j.phase === 'ended') {
      html += '<button class="btn-line tl-toggle" id="timelineBtn">📖 展开完整旅程时间线</button><div id="timelineBox" style="display:none;"></div>';
    }

    // 待回应信号
    if (j.pendingSignal && !j.pendingSignal.replied) {
      var s = j.pendingSignal;
      html += '<div class="signal-card" id="signalCard">' +
        '<div class="signal-tag"><span class="blink"></span>它寄来了一个信号 · 还没决定怎么做</div>' +
        '<div class="signal-text">' + esc(s.text || '') + '</div>' +
        '<div class="signal-due">补给截止 <b id="signalDue" data-due="' + s.dueAt + '">' + fmtDuration(s.remainingMs) + '</b> · 不回也没关系，到点它会自己决定</div>' +
        '<div class="signal-actions">它在犹豫：' + s.actions.map(function (a) { return esc(a.label) + '（' + esc(a.cost) + '）'; }).join(' / ') + '</div>' +
        '<div class="signal-reply"><textarea id="signalReplyText" maxlength="120" placeholder="可以捎一句话：信息、态度、或一句许可（可选）"></textarea>' +
        '<button class="reply-btn" id="signalReplyBtn">寄出</button></div></div>';
    } else if (j.pendingSignal && j.pendingSignal.replied) {
      html += '<div class="signal-card"><div class="signal-tag"><span class="blink"></span>已回应 · 它正在结合你的话做决定</div></div>';
    }

    html += renderMessages(j.messages);

    // 底部：语气 + 结束
    if (j.status !== 'ended_user' && j.status !== 'ended_natural') {
      var tones = [['gentle', '轻一点'], ['balanced', '刚好'], ['absurd', '更荒唐一点']];
      html += '<div class="jfoot"><div class="tone-inline">往后的故事：' +
        tones.map(function (t) {
          return '<button class="chip aqua tone-mini' + (j.tone === t[0] ? ' active' : '') + '" data-tone="' + t[0] + '">' + t[1] + '</button>';
        }).join('') +
        '<span style="opacity:.7">（只影响未来）</span></div>' +
        '<button class="end-link" id="endJourneyBtn">结束这段旅程</button></div>';
    } else {
      html += '<div class="jfoot"><span class="tone-inline">这段旅程已收束。' +
        '<button class="btn-line" id="reGoBtn" style="margin-left:8px">让' + esc(j.creatureName) + '再次出发</button></span></div>';
    }

    body.innerHTML = html;

    // 信号倒计时
    var dueEl = $('signalDue');
    if (dueEl) {
      clearInterval(state.countdownTimer);
      state.countdownTimer = setInterval(function () {
        var remain = parseInt(dueEl.dataset.due, 10) - Date.now();
        dueEl.textContent = fmtDuration(remain);
        if (remain <= 0) { clearInterval(state.countdownTimer); loadJourney(state.currentJourneyId); }
      }, 1000);
      var btn = $('signalReplyBtn');
      btn.addEventListener('click', function () {
        var ta = $('signalReplyText');
        var text = (ta.value || '').trim();
        if (!text) { toast('想写点什么再寄出（也可以不回，等它自己决定）'); return; }
        btn.disabled = true;
        api('/api/journey/' + encodeURIComponent(j.id) + '/reply', { method: 'POST', body: { text: text } })
          .then(function (r) {
            btn.disabled = false;
            if (r.data && r.data.ok) {
              toast(r.data.ontime ? '回应已寄出，它收到了' : (r.data.message || '来晚了，它会记在心里'));
              loadJourney(j.id);
            } else {
              toast(r.data.message || r.data.error || '没寄出去，稍后再试');
            }
          }).catch(function () { btn.disabled = false; toast('网络不太顺畅'); });
      });
    }

    // 语气切换
    body.querySelectorAll('.tone-mini').forEach(function (chip) {
      chip.addEventListener('click', function () {
        api('/api/journey/' + encodeURIComponent(j.id) + '/tone', { method: 'POST', body: { tone: chip.dataset.tone } })
          .then(function (r) {
            if (r.data && r.data.ok) { toast('往后它会讲得' + chip.textContent.trim()); loadJourney(j.id); }
            else toast('没改成，稍后再试');
          });
      });
    });

    // 旅程回顾时间线（懒加载 + 展开/收起）
    var tlBtn = $('timelineBtn');
    if (tlBtn) {
      tlBtn.addEventListener('click', function () {
        var box = $('timelineBox');
        if (box.dataset.loaded === '1') {
          var show = box.style.display === 'none';
          box.style.display = show ? 'block' : 'none';
          tlBtn.textContent = show ? '📕 收起完整旅程' : '📖 展开完整旅程时间线';
          return;
        }
        tlBtn.disabled = true;
        api('/api/journey/' + encodeURIComponent(j.id) + '/timeline').then(function (r) {
          tlBtn.disabled = false;
          if (!r.data || !r.data.ok) { toast((r.data && r.data.message) || '回顾还没准备好'); return; }
          box.innerHTML = renderTimeline(r.data.timeline.nodes);
          box.style.display = 'block';
          box.dataset.loaded = '1';
          tlBtn.textContent = '📕 收起完整旅程';
        }).catch(function () { tlBtn.disabled = false; toast('网络不太顺畅'); });
      });
    }

    // 结束旅程
    var endBtn = $('endJourneyBtn');
    if (endBtn) {
      endBtn.addEventListener('click', function () {
        if (!confirm('确定结束这段旅程吗？它不会再寄新的信，已收到的信还在。')) return;
        api('/api/journey/' + encodeURIComponent(j.id) + '/end', { method: 'POST' })
          .then(function (r) {
            if (r.data && r.data.ok) { toast('旅程已结束'); loadJourney(j.id); }
            else toast(r.data.error || '操作失败');
          });
      });
    }
    var reGo = $('reGoBtn');
    if (reGo) {
      reGo.addEventListener('click', function () {
        switchPage('release');
        selectCreature(j.species, j.creatureId);
        state.redepartOpen = true;
        $('redepartBox').classList.add('open');
        $('redepartToggle').classList.add('on');
      });
    }
  }

  // ==================== 启动 ====================
  renderMarkers();
  initGlobe();
  loadCreatures();
  startPulse();
  api('/api/health').then(function (r) {
    if (r.data && r.data.aiEnabled === false) {
      console.warn('[journey] AI 未启用：旅程无法开局（服务端需配置 AI_API_KEY）');
    }
  }).catch(function () {});
})();
</script>
</body>
</html>
